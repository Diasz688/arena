<button class="btn red" onclick="if(this.dataset.c){S.runs=[];S.matches=[];S.teams=[];S.players=[];S.sess=[];S.goals=[];save();go('home')}else{this.dataset.c=1;this.textContent='Toque de novo para apagar tudo'}">Apagar meus dados</button>`},

return`<button class="back" onclick="back()">‹ Voltar</button><div class="ph s-${sp}"><span class="si">${IC[sp]}</span><div><h1>${SP[sp].n}</h1><div class="mu">${DESC[sp]}</div></div></div><button class="btn" onclick="snew('${sp}')">+ Registrar treino</button>

<h2>Minutos por semana</h2><div class="card">${wbars(wk(a,x=>x.min))}</div><h2>Recordes pessoais</h2>${recs(sp)}<h2>Metas</h2>${goals(sp)}<h2>Histórico</h2>${a.map(srow).join("")||'<div class="empty"><b>Nenhum treino</b><span>Registre seu primeiro treino de '+SP[sp].n.toLowerCase()+'.</span></div>'}`},

<label class="mu">Intensidade percebida: <b id="rv">${F.rpe}</b>/10</label><input type="range" min="1" max="10" value="${F.rpe}" oninput="F.rpe=+this.value;$('#rv').textContent=this.value" style="padding:0">

<div class="card"><div class="mu">Meta semanal: ${km(since(7)).toFixed(1)} / ${S.goal} km</div><div class="pg" style="margin-top:8px"><div style="width:${Math.min(100,S.goal?km(since(7))/S.goal*100:0)}%"></div></div></div>
<div id="ctl"></div><div id="live"></div>

<h2>Evolução do ritmo</h2><div class="card">${paceTrend()}</div><h2>Metas</h2>${goals("run")}<h2>Histórico</h2>${S.runs.map((r,i)=>{const p=S.runs[i+1],dl=p&&p.dist>0.05?(r.time/r.dist-p.time/p.dist):null;return`<div class="card">${route(r.pts)}<div class="row" style="margin-top:8px"><div><b>${r.dist.toFixed(2)} km</b><div class="mu">${new Date(r.date).toLocaleDateString("pt-BR")}</div></div><div><b>${fT(r.time)}</b><div class="mu">${pace(r.dist,r.time)}/km</div></div><div><b>${r.cal} kcal</b><div class="mu">máx ${r.max.toFixed(1)} km/h</div></div></div>${dl!==null?`<div class="mu" style="margin-top:6px">vs. anterior: <span class="${dl<0?"g":""}">${dl<0?"▲ ":"▼ "}${Math.abs(Math.round(dl))} s/km ${dl<0?"mais rápido":"mais lento"}</span></div>`:""}</div>`}).join("")||'<div class="empty"><b>Nenhuma corrida</b><span>Sua primeira corrida aparece aqui.</span></div>'}
<div class="card mu">Desafios de corrida: ainda não implementado.</div>`},
};
function elapsed(r){return Math.floor(((r.accumMs||0)+(r.st==="run"?Math.max(0,Date.now()-r.startedAt):0))/1000)}
function live(){
 const r=R;if(!r||!$("#live"))return;
 if(r.st!=="idle")r.el=elapsed(r);
 const el=r.el,v=el>0?r.dist/(el/3600):0,cal=Math.round(r.dist*(r.sport==="bike"?25:70));
 const state=r.st==="idle"?"Pronto para iniciar":r.st==="pause"?"Atividade pausada":r.pts.length?"GPS ativo · precisão aprox. "+(r.accuracy||"?")+" m":"Procurando sinal GPS";
 $("#live").innerHTML=`<div class="card"><div class="gps-state ${r.pts.length?"good":""}"><span class="gps-dot"></span>${state}</div><div class="race-head">Tempo de corrida</div><div class="race-time">${fT(el)}</div><div class="race-metrics"><div class="race-metric"><div class="mu">Distância</div><b>${r.dist.toFixed(2)}</b><small>km</small></div><div class="race-metric"><div class="mu">Ritmo médio</div><b>${pace(r.dist,el)}</b><small>min/km</small></div><div class="race-metric"><div class="mu">Calorias</div><b>${cal}</b><small>kcal*</small></div></div><div class="route-frame">${route(r.pts)}</div><div class="race-footer"><div><div class="mu">Velocidade média</div><b>${v.toFixed(1)} km/h</b></div><div><div class="mu">Velocidade máxima</div><b>${r.max.toFixed(1)} km/h</b></div></div>${r.err?`<div class="err">${esc(r.err)}</div>`:""}${r.wn?`<div class="warn">${esc(r.wn)}</div>`:""}${r.wk?'<div class="mu" style="margin-top:8px;font-size:11px">✓ Tela mantida acesa com o app visível.</div>':""}<div class="privacy-note" style="margin-top:10px">* Calorias estimadas para 70 kg. O GPS na versão web pode parar se a tela for bloqueada.</div></div>`;
 $("#ctl").innerHTML=r.st==="idle"?`<button class="btn" onclick="rs()">▶ Iniciar corrida</button>`:`<div class="row"><button class="btn alt" onclick="rp()">${r.st==="run"?"⏸ Pausar":"▶ Continuar"}</button><button class="btn red" onclick="rf()">⏹ Finalizar</button></div>`;
}
function rs(){
 if(!R||R.st!=="idle")return;
 if(!navigator.geolocation){R.err="Este aparelho não oferece geolocalização.";return live()}
 if(!window.isSecureContext){R.err="GPS requer HTTPS ou localhost. Publique o aplicativo em um endereço seguro.";return live()}
 R.st="run";R.err="";R.pts=[];R.dist=0;R.max=0;R.el=0;R.skip=false;R.startedAt=Date.now();R.accumMs=0;
 wl();
 try{
 R.wid=navigator.geolocation.watchPosition(p=>{
  if(!R||R.st!=="run")return;
  const c=p.coords;
  if(!Number.isFinite(c.accuracy)||c.accuracy>35){R.accuracy=Math.round(c.accuracy);R.err="Sinal GPS impreciso; procure céu aberto para registrar o percurso.";live();return}
  R.err="";R.lastFix=Date.now();R.accuracy=Math.round(c.accuracy);
  const q=[c.latitude,c.longitude,p.timestamp],l=R.pts[R.pts.length-1];
  if(l&&!R.skip){
   const d=hav(l,q),dt=(q[2]-l[2])/1000;
   if(dt<=0)return;
   if(d<0.006)return; // menos de 6 m pode ser apenas oscilação de GPS
   if(dt>120){R.skip=true;} // novo trecho depois de longo intervalo
   else{
    const speed=d/dt*3600;
    if(speed>(R.sport==="bike"?120:34))return; // elimina saltos impossíveis de GPS
    R.dist+=d;R.max=Math.max(R.max,speed);
   }
  }
  R.skip=false;R.pts.push(q);live();
 },e=>{
  if(!R)return;
  R.err=e.code===1?"Permissão de localização negada. Libere o acesso nas configurações do navegador.":"Aguardando GPS. Vá para um local aberto e confirme a localização do aparelho.";
  live();
 },{enableHighAccuracy:true,maximumAge:0,timeout:20000});
 }catch(e){R.err="Não foi possível iniciar o GPS neste navegador.";R.st="idle";try{R.wk&&R.wk.release()}catch(_){};live();return}
 if(tm)clearInterval(tm);
 tm=setInterval(()=>{if(R&&R.st==="run")live()},1000);live();
}
function rp(){
 if(!R||R.st==="idle")return;
 if(R.st==="run"){R.accumMs+=Math.max(0,Date.now()-R.startedAt);R.st="pause"}
 else{R.startedAt=Date.now();R.st="run";R.skip=true}
 R.el=elapsed(R);live();
}
function rf(){
 if(!R||R.st==="idle")return;
 if(R.st==="run")R.accumMs+=Math.max(0,Date.now()-R.startedAt);
 R.st="pause";R.el=elapsed(R);
 if(R.wid!=null)navigator.geolocation.clearWatch(R.wid);
 clearInterval(tm);tm=null;
 try{R.wk&&R.wk.release()}catch(e){}
 if(R.dist>=.01){
  const k=Math.max(1,Math.ceil(R.pts.length/200));
  const pts=R.pts.filter((_,i)=>i%k===0).map(p=>[+p[0].toFixed(5),+p[1].toFixed(5)]);
  if(R.pts.length>1){const p=R.pts[R.pts.length-1];if(pts.length&&pts[pts.length-1][0]!==+p[0].toFixed(5))pts.push([+p[0].toFixed(5),+p[1].toFixed(5)])}
  S.runs.unshift({date:new Date().toISOString(),dist:R.dist,time:R.el,sport:R.sport||"run",max:R.max,cal:Math.round(R.dist*(R.sport==="bike"?25:70)),pts});
  const ok=save();toast(ok?"Corrida salva ✓":"Corrida em memória. Exporte backup antes de sair.");
 } else toast("Corrida encerrada: distância insuficiente para salvar.");
 R=null;open_("run");
}

function open_(k){if(R&&R.st!=="idle"&&k!=="run"){toast("Finalize a corrida para sair.");return}sub=k;if(k==="run"&&!R)R={st:"idle",pts:[],dist:0,el:0,max:0,err:""};render()}
function back(){if(R&&R.st!=="idle"){toast("Finalize a corrida para sair.");return}sub=null;render()}
function go(t){if(R&&R.st!=="idle"){toast("Finalize a corrida antes de mudar de aba.");return}tab=t;sub=null;render()}
function render(){const mn=$("#main");mn.style.animation="none";void mn.offsetWidth;mn.style.animation="";mn.innerHTML=sub?(sub==="run"?V.run():sub==="form"?V.form():V.sp(sub)):V[tab]();if(sub==="run")live();
$("#nav").innerHTML=[["home","Início"],["sports","Esportes"],["act","Atividade"],["com","Comunidade"],["prof","Perfil"]].map(([k,n])=>`<button class="${tab===k?"on":""}" onclick="go('${k}')"><span>${IC[k]}</span>${n}</button>`).join("");window.scrollTo(0,0)}
window.addEventListener("beforeunload",e=>{if(R&&R.st!=="idle"){e.preventDefault();e.returnValue=""}});
render();

<script>
// Arena+ corrida: mapa persistente, qualidade de sinal e resumo privado.
let arenaMap=null, arenaMapNode=null, arenaLine=null, arenaMarker=null, arenaAccuracy=null, arenaFollow=true;
const arenaOldLive=live;
live=function(){
 if(arenaMapNode&&arenaMapNode.isConnected)arenaMapNode.remove();
 arenaOldLive();
 if(!R||!document.querySelector('#live'))return;
 const host=document.querySelector('#live .route-frame');
 if(host){
  if(window.L){
   if(!arenaMapNode){arenaMapNode=document.createElement('div');arenaMapNode.className='arena-map';arenaMapNode.setAttribute('aria-label','Mapa do percurso da corrida');}
   host.replaceChildren(arenaMapNode);
   if(!arenaMap){arenaMap=L.map(arenaMapNode).setView([-14.2,-51.9],3);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(arenaMap).on('tileerror',()=>{const note=document.querySelector('#map-status');if(note)note.textContent='Mapa indisponível. O GPS continua registrando; confira sua conexão.'});arenaLine=L.polyline([],{color:'#f52238',weight:5}).addTo(arenaMap);arenaMap.on('dragstart',()=>arenaFollow=false);}
   const pts=R.pts.map(p=>p.slice(0,2));arenaLine.setLatLngs(pts);
   if(pts.length){const last=pts[pts.length-1];if(!arenaMarker){arenaMarker=L.circleMarker(last,{radius:7,color:'#fff',weight:3,fillColor:'#f52238',fillOpacity:1}).addTo(arenaMap);arenaAccuracy=L.circle(last,{radius:R.accuracy||0,color:'#f52238',weight:1,fillOpacity:.08}).addTo(arenaMap);}arenaMarker.setLatLng(last);arenaAccuracy.setLatLng(last).setRadius(R.accuracy||0);if(arenaFollow)arenaMap.setView(last,Math.max(arenaMap.getZoom(),16),{animate:false});}

async function arenaCloudSave(){if(arenaAuthBusy||!arenaUser)return;if(arenaBusyActivity()){arenaMessage('Finalize a corrida antes de salvar.');return}if(!confirm('Salvar seus treinos e percursos GPS na conta? Isso substitui a cópia online anterior.'))return;arenaAuthBusy=true;const snapshot=JSON.parse(JSON.stringify(S));arenaMessage('Salvando seus treinos…');try{const user=await arenaVerifiedUser();const {error}=await arenaClient.from('arena_accounts_data').upsert({user_id:user.id,data:snapshot,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)throw error;arenaMessage('Treinos salvos na sua conta.')}catch(e){arenaMessage('Não foi possível salvar. Seus treinos continuam neste aparelho. Confira a internet e tente novamente.')}finally{arenaAuthBusy=false}}
async function arenaCloudLoad(){if(arenaAuthBusy||!arenaUser)return;if(arenaBusyActivity()){arenaMessage('Finalize a corrida antes de restaurar.');return}arenaAuthBusy=true;arenaMessage('Buscando seus treinos…');try{const user=await arenaVerifiedUser();const {data,error}=await arenaClient.from('arena_accounts_data').select('data,updated_at').eq('user_id',user.id).maybeSingle();if(error)throw error;if(!data){arenaMessage('Ainda não há treinos salvos nesta conta.');return}const next=arenaValidate(JSON.stringify(data.data));if(!confirm('Restaurar os treinos da conta? Os treinos locais desta conta serão substituídos.')){arenaMessage('Restauração cancelada.');return}if(user.id!==arenaUser?.id)throw Error('Sessão alterada');S=next;save();arenaAuthNotice='Treinos restaurados da sua conta.';render()}catch(e){arenaMessage('Não foi possível restaurar. Seus treinos locais foram mantidos.')}finally{arenaAuthBusy=false}}
function arenaImportGuest(){if(!arenaUser||arenaBusyActivity())return;try{const guest=arenaValidate(localStorage.getItem('arena')||arenaGuestInitial);if(!confirm('Copiar seus treinos antigos para esta conta neste aparelho? Os treinos locais da conta serão substituídos. A cópia online só muda quando você tocar em Salvar treinos.'))return;S=guest;save();arenaAuthNotice='Treinos copiados. Salvando automaticamente na sua conta…';render()}catch(e){arenaMessage('Não foi possível ler os treinos antigos. Você também pode restaurar um arquivo salvo.')}}
if(arenaClient){arenaClient.auth.onAuthStateChange((event,session)=>{setTimeout(()=>{if(arenaBusyActivity()&&event!=='INITIAL_SESSION'){if(!session)arenaMessage('Sua sessão expirou. Finalize a corrida e entre novamente.');return}arenaSwitchUser(session?.user||null)},0)});fetch('https://sbxnuegmmrzzhxkvhrrr.supabase.co/auth/v1/settings',{headers:{apikey:'sb_publishable_sO1V5xuXgOL98DB5IH60yw_ZvAA5fTU'}}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(v=>{arenaProviderSettings.google=!!v.external?.google;arenaProviderSettings.facebook=!!v.external?.facebook;if(!arenaBusyActivity()&&tab==='prof')render()}).catch(()=>{});arenaClient.auth.getSession().then(({data,error})=>{if(error){arenaAuthNotice='Entre novamente para acessar sua conta.';}arenaSwitchUser(data?.session?.user||null)}).catch(()=>{arenaAuthLoading=false;arenaAuthNotice='Não foi possível verificar a conta. Confira a internet.';if(!arenaBusyActivity())render()});}else{arenaAuthLoading=false;render()}
</script>

<style>
#arena-login-gate{position:fixed;inset:0;z-index:180;background:radial-gradient(ellipse at top,#341220,#0a0a10 65%);overflow-y:auto;padding:35px 20px;display:flex;align-items:flex-start;justify-content:center}#arena-login-gate .gate-inner{width:100%;max-width:430px;margin:auto}#arena-login-gate .brand-word{font-size:34px;margin:0 0 12px;text-align:center}#arena-login-gate .gate-lead{color:#ada4b3;text-align:center;font-size:14px;line-height:1.6;margin-bottom:24px}#arena-login-gate .account-panel{margin:0}.sync-status{font-size:12px;color:#b8b0bf;padding:10px 0;line-height:1.5}.sync-status[data-state=saved]{color:#88dbae}.sync-status[data-state=error]{color:#ffb985}body.arena-gated{overflow:hidden}
</style>
<script>
let arenaCloudReady=false,arenaSyncTimer=null,arenaSyncRunning=false,arenaSyncAgain=false,arenaSyncVersion=0,arenaLoadUser=null,arenaLoadPromise=null,arenaSyncStatus='Entre para acessar seus treinos.',arenaSyncState='idle';
window.arenaAutoEnabled=true;
function arenaSyncLabel(text,state='idle'){arenaSyncStatus=text;arenaSyncState=state;document.querySelectorAll('.sync-status').forEach(el=>{el.textContent=text;el.dataset.state=state})}
function arenaGate(){
 let gate=document.querySelector('#arena-login-gate');
 if(arenaUser&&arenaCloudReady){gate?.remove();document.body.classList.remove('arena-gated');document.querySelector('#app')?.removeAttribute('inert');document.querySelector('#nav')?.removeAttribute('inert');return}
 if(!gate){gate=document.createElement('div');gate.id='arena-login-gate';gate.setAttribute('role','dialog');gate.setAttribute('aria-modal','true');gate.setAttribute('aria-label','Entrar no Arena');document.body.append(gate)}
 document.body.classList.add('arena-gated');document.querySelector('#app')?.setAttribute('inert','');document.querySelector('#nav')?.setAttribute('inert','');
 gate.innerHTML='<div class="gate-inner"><div class="brand-word">ARENA<span>+</span></div><p class="gate-lead">Seu esporte. Sua evolução.<br>Entre para continuar de onde parou.</p>'+(arenaUser?'<section class="account-panel"><h2>Preparando seus treinos</h2><p role="status">'+esc(arenaSyncStatus)+'</p></section>':arenaAuthCard())+'</div>';
}
const arenaRenderWithAccounts=render;
render=function(){arenaRenderWithAccounts();arenaGate()};
const arenaProfileWithAccounts=V.prof;
V.prof=function(){const content=arenaProfileWithAccounts();return content.replace('<button class="btn" onclick="arenaCloudSave()">Salvar treinos na minha conta</button>','').replace('<div id="arena-auth-message"','<div class="sync-status" data-state="'+arenaSyncState+'">'+esc(arenaSyncStatus)+'</div><div id="arena-auth-message"')};
function arenaQueueSync(){
 if(!arenaCloudReady||!arenaUser)return;
 arenaSyncVersion++;try{localStorage.setItem(arenaDataKey+'-pending','1')}catch(_){}
 arenaSyncLabel(navigator.onLine===false?'Sem internet. Treinos salvos neste aparelho; serão enviados quando a conexão voltar.':'Salvando seus treinos…',navigator.onLine===false?'error':'idle');
 clearTimeout(arenaSyncTimer);arenaSyncTimer=setTimeout(arenaPushAuto,900);
}
async function arenaPushAuto(){
 if(!arenaUser||!arenaCloudReady)return;
 if(arenaSyncRunning){arenaSyncAgain=true;return}
 const userId=arenaUser.id,key=arenaDataKey,version=arenaSyncVersion,snapshot=JSON.parse(JSON.stringify(S));
 arenaSyncRunning=true;arenaSyncAgain=false;
 try{if(navigator.onLine===false)throw Error('offline');const user=await arenaVerifiedUser();if(user.id!==userId)throw Error('session');const {error}=await arenaClient.from('arena_accounts_data').upsert({user_id:userId,data:snapshot,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)throw error;if(arenaUser?.id===userId&&version===arenaSyncVersion){localStorage.removeItem(key+'-pending');arenaSyncLabel('Todos os treinos salvos na sua conta.','saved')}}catch(e){if(arenaUser?.id===userId)arenaSyncLabel('Não foi possível salvar online agora. A cópia ficou neste aparelho; tentaremos novamente.','error')}finally{arenaSyncRunning=false;if(arenaSyncAgain||version!==arenaSyncVersion){arenaSyncAgain=false;clearTimeout(arenaSyncTimer);arenaSyncTimer=setTimeout(arenaPushAuto,900)}}
}
const arenaLocalSwitch=arenaSwitchUser;
arenaSwitchUser=function(user){
 if(!user){arenaCloudReady=false;arenaLoadUser=null;clearTimeout(arenaSyncTimer);arenaLocalSwitch(null);arenaGate();return Promise.resolve()}
 if(arenaUser?.id===user.id&&arenaCloudReady){arenaUser=user;arenaGate();return Promise.resolve()}
 if(arenaLoadUser===user.id&&arenaLoadPromise)return arenaLoadPromise;
 arenaCloudReady=false;arenaSyncLabel('Buscando os treinos da sua conta…');arenaLoadUser=user.id;arenaLocalSwitch(user);arenaGate();
 arenaLoadPromise=(async()=>{const key='arena-account-'+user.id;try{const {data,error}=await arenaClient.from('arena_accounts_data').select('data,updated_at').eq('user_id',user.id).maybeSingle().abortSignal(AbortSignal.timeout(15000));if(error)throw error;if(arenaUser?.id!==user.id)return;
 const pending=localStorage.getItem(key+'-pending')==='1';
 if(data&&!pending){S=arenaValidate(JSON.stringify(data.data));save();arenaSyncLabel('Seus treinos foram restaurados.','saved')}
 else if(pending){arenaSyncLabel('Há treinos deste aparelho aguardando envio.','idle')}
 else arenaSyncLabel('Sua conta está pronta. Os próximos treinos serão salvos automaticamente.','saved');
 arenaCloudReady=true;render();if(pending)arenaPushAuto();
 }catch(e){if(arenaUser?.id!==user.id)return;arenaCloudReady=true;arenaSyncLabel('Não foi possível buscar os treinos online. Usando a cópia deste aparelho.','error');render();
 // Do not overwrite unseen cloud data after a failed initial load.
 arenaCloudReady=false;arenaGateRetry();
 }finally{if(arenaLoadUser===user.id){arenaLoadUser=null;arenaLoadPromise=null}}})();return arenaLoadPromise;
};
function arenaGateRetry(){arenaGate();const gate=document.querySelector('#arena-login-gate .account-panel');if(gate){gate.innerHTML='<h2>Não foi possível conectar</h2><p class="mu">Precisamos buscar seus treinos antes de continuar, para preservar os dados da sua conta.</p><button class="btn" onclick="arenaSwitchUser(arenaUser)">Tentar novamente</button><button class="btn alt" onclick="arenaLogout()">Sair da conta</button>';}}
const arenaOriginalLogout=arenaLogout;
arenaLogout=async function(){if(arenaSyncRunning){arenaMessage('Aguarde o salvamento terminar antes de sair.');return}if(arenaUser&&localStorage.getItem(arenaDataKey+'-pending')==='1'){await arenaPushAuto();if(localStorage.getItem(arenaDataKey+'-pending')==='1'){arenaMessage('Não foi possível enviar os últimos treinos. Conecte à internet antes de sair.');return}}await arenaOriginalLogout()};
const arenaOldMessage=arenaMessage;
arenaMessage=function(text){arenaOldMessage(text);const gate=document.querySelector('#arena-login-gate #arena-auth-message');if(gate)gate.textContent=text};
window.addEventListener('online',()=>{if(arenaUser){if(!arenaCloudReady)arenaSwitchUser(arenaUser);else if(localStorage.getItem(arenaDataKey+'-pending')==='1')arenaPushAuto()}});
setInterval(()=>{if(arenaUser&&!arenaSyncRunning){if(!arenaCloudReady)arenaSwitchUser(arenaUser);else if(localStorage.getItem(arenaDataKey+'-pending')==='1')arenaPushAuto()}},30000);
window.addEventListener('beforeunload',e=>{if(arenaUser&&localStorage.getItem(arenaDataKey+'-pending')==='1'){e.preventDefault();e.returnValue=''}});
render();
</script>

<script>
async function arenaVerifyCode(form){if(arenaAuthBusy||!arenaClient)return;const token=form.elements.code.value.replace(/\s/g,'');if(!/^\d{6,10}$/.test(token)){arenaMessage('Digite o código numérico recebido por e-mail.');return}arenaAuthBusy=true;const button=form.querySelector('button[type=submit]');button.disabled=true;arenaMessage('Conferindo seu código…');try{const {data,error}=await arenaClient.auth.verifyOtp({email:arenaPendingEmail,token,type:'signup'});if(error)throw error;if(!data.session)throw Error('missing_session');form.elements.code.value='';arenaPendingEmail='';arenaAuthMode='login';arenaAuthNotice='E-mail confirmado!';await arenaSwitchUser(data.session.user)}catch(e){arenaMessage(/expired|invalid|otp/i.test(e.code+' '+e.message)?'Código incorreto ou expirado. Confira o último e-mail ou solicite um novo código.':arenaAuthError(e))}finally{arenaAuthBusy=false;if(button.isConnected)button.disabled=false}}
async function arenaResendCode(button){if(arenaAuthBusy||!arenaPendingEmail||!arenaClient)return;const seconds=Math.ceil((60000-(Date.now()-arenaCodeSentAt))/1000);if(seconds>0){arenaMessage('Aguarde '+seconds+' segundos para reenviar.');return}arenaAuthBusy=true;button.disabled=true;arenaMessage('Solicitando um novo código…');try{const {error}=await arenaClient.auth.resend({type:'signup',email:arenaPendingEmail});if(error)throw error;arenaCodeSentAt=Date.now();arenaMessage('Novo e-mail solicitado. Use o código da mensagem mais recente.')}catch(e){arenaMessage(arenaAuthError(e))}finally{arenaAuthBusy=false;if(button.isConnected)button.disabled=false}}
render();
</script>

<style>.endurance-choice{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.endurance-choice button{white-space:normal;text-align:left;min-height:132px;padding:18px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between}.endurance-choice svg{width:32px;height:32px}.endurance-choice small{font-weight:400;color:#d5c9d1}.endurance-choice .alt{border-color:#575368}.endurance-number{font-size:40px;font-weight:800;letter-spacing:-1px}.training-filter{display:flex;gap:8px;margin:16px 0}.training-filter button{flex:1}.endurance-record{display:flex;justify-content:space-between;align-items:center;gap:14px}.endurance-record svg{width:26px;height:26px;color:#ff5365}.endurance-record small{display:block;color:var(--mu);margin-top:5px}</style>
<script>
// Corrida e ciclismo compartilham o gravador GPS, mas preservam a modalidade em cada registro.
IC.run=sv('<circle cx="14" cy="4" r="2"/><path d="M7 8l4-2 4 5 4 1M11 7l-2 6 5 3-2 5M9 13l-3 5H2"/>');
IC.bike=sv('<circle cx="5.5" cy="16" r="4"/><circle cx="18.5" cy="16" r="4"/><path d="M5.5 16l5-9 5 9h-10l4-6h7M9 7H6m9-3h3l2 7"/>');
let enduranceMode='run',enduranceFilter='all';
const enduranceSport=r=>r.sport==='bike'?'bike':'run';
const enduranceName=k=>k==='bike'?'Ciclismo':'Corrida';
const enduranceRuns=k=>S.runs.filter(r=>enduranceSport(r)===k);
const enduranceSpeed=r=>(r.time>0?r.dist*3600/r.time:0).toFixed(1);
function enduranceStart(k){if(R&&R.st!=='idle'){toast('Finalize o treino atual primeiro.');return}enduranceMode=k;R={st:'idle',pts:[],dist:0,el:0,max:0,err:'',sport:k};sub='run';render()}
const enduranceOriginalOpen=open_;
open_=function(k){if(k==='bike'){enduranceStart('bike');return}if(k==='run'&&(!R||R.st==='idle'))enduranceMode='run';enduranceOriginalOpen(k);if(k==='run'&&R&&R.st==='idle'){R.sport=enduranceMode;live()}};
function enduranceRows(a){return a.map(r=>`<div class="card endurance-record"><span>${IC[enduranceSport(r)]}</span><div style="flex:1"><b>${enduranceName(enduranceSport(r))} · ${r.dist.toFixed(2)} km</b><small>${new Date(r.date).toLocaleDateString('pt-BR')} · ${fT(r.time)}</small></div><div><b>${enduranceSport(r)==='bike'?enduranceSpeed(r):pace(r.dist,r.time)}</b><small>${enduranceSport(r)==='bike'?'km/h':'min/km'}</small></div></div>`).join('')||'<div class="empty"><b>Seu primeiro treino começa aqui</b><span>Escolha corrida ou ciclismo para gravar com GPS.</span></div>'}
function enduranceChoices(){return `<div class="endurance-choice"><button class="btn" onclick="enduranceStart('run')">${IC.run}<b>Corrida</b><small>Ritmo e distância</small></button><button class="btn alt" onclick="enduranceStart('bike')">${IC.bike}<b>Ciclismo</b><small>Velocidade e percurso</small></button></div>`}
V.home=function(){const a=S.runs,w=a.filter(r=>inD(r.date,7));return `<div class="brandbar"><div class="brand-word">ARENA<span>+</span></div><div class="brand-chip">CORRA · PEDALE</div></div><div class="hd">${AV()}<div><div class="mu">Seu próximo quilômetro começa aqui.</div><h1>${esc(S.name)}</h1></div></div>${enduranceChoices()}<div class="card"><div class="overline">Sua semana</div><div class="week-strip">${wkstrip(a)}</div><div class="grid3"><div><b>${km(w).toFixed(1)}</b><span> km</span></div><div><b>${w.length}</b><span> treinos</span></div><div><b>${(w.reduce((t,r)=>t+r.time,0)/3600).toFixed(1)}</b><span> horas</span></div></div></div><div class="grid">${['run','bike'].map(k=>`<div class="card"><div class="mu">${enduranceName(k)} · total</div><div class="endurance-number">${km(enduranceRuns(k)).toFixed(1)}</div><span class="mu">km · ${enduranceRuns(k).length} treinos</span></div>`).join('')}</div><h2>Seu objetivo de corrida</h2>${enduranceGoalCard()}<h2>Últimos treinos</h2>${enduranceRows(a.slice(0,4))}`};
V.sports=function(){return `<div class="page-kicker">DUAS MODALIDADES. UM OBJETIVO.</div><h1>Vá mais longe.</h1><p class="mu">Corrida e ciclismo com percurso GPS, tempo e evolução separados.</p>${enduranceChoices()}<div class="card"><b>Corrida e maratona</b><p class="mu">Acompanhe o ritmo em min/km e escolha sua distância de prova.</p></div><div class="card"><b>Ciclismo</b><p class="mu">Acompanhe velocidade em km/h, tempo e distância dos seus pedais.</p></div>`};
V.act=function(){const a=S.runs.filter(r=>enduranceFilter==='all'||enduranceSport(r)===enduranceFilter);return `<h1>Seus treinos</h1>${enduranceChoices()}<div class="training-filter">${[['all','Todos'],['run','Corrida'],['bike','Ciclismo']].map(([k,n])=>`<button class="btn ${enduranceFilter===k?'':'alt'} sm" onclick="enduranceFilter='${k}';render()">${n}</button>`).join('')}</div>${enduranceRows(a)}`};
function enduranceGoal(){return S.enduranceGoal||{distance:5,date:''}}
function enduranceGoalCard(){const g=enduranceGoal(),best=Math.max(0,...enduranceRuns('run').map(r=>r.dist)),pct=Math.min(100,best/g.distance*100);return `<div class="card"><b>${g.distance===42.195?'Maratona':g.distance===21.0975?'Meia maratona':g.distance+' km'}</b><p class="mu">Maior corrida registrada: ${best.toFixed(2)} km${g.date?' · Prova: '+esc(g.date.split('-').reverse().join('/')):''}</p><div class="pg"><div style="width:${pct}%"></div></div><p class="privacy-note">Referência de distância. Não representa um plano de preparação.</p><button class="btn alt sm" onclick="go('com')">Definir meu objetivo</button></div>`}
function enduranceSetGoal(form){S.enduranceGoal={distance:Number(form.elements.distance.value),date:form.elements.raceDate.value};save();toast('Objetivo salvo');render()}
V.com=function(){const g=enduranceGoal();return `<div class="page-kicker">CADA QUILÔMETRO CONTA</div><h1>Sua próxima prova</h1><p class="mu">Escolha uma distância para acompanhar a evolução das suas corridas.</p><form class="card" onsubmit="event.preventDefault();enduranceSetGoal(this)"><label for="race-distance">Distância</label><select id="race-distance" name="distance">${[[5,'5 km'],[10,'10 km'],[21.0975,'Meia maratona · 21,1 km'],[42.195,'Maratona · 42,195 km']].map(([d,n])=>`<option value="${d}" ${g.distance===d?'selected':''}>${n}</option>`).join('')}</select><label for="race-date">Data da prova (opcional)</label><input id="race-date" name="raceDate" type="date" value="${esc(g.date)}"><button class="btn" type="submit">Salvar objetivo</button></form>${enduranceGoalCard()}<h2>Evolução da corrida</h2>${enduranceRows(enduranceRuns('run').slice(0,5))}`};
V.prof=function(){return `${arenaAuthCard()}<h1>Seu perfil</h1><div class="card"><label for="endurance-name">Nome</label><input id="endurance-name" value="${esc(S.name)}" oninput="S.name=this.value||'Atleta';save()"><p class="mu">Corrida e ciclismo · seus treinos na sua conta.</p><div class="sync-status" data-state="${arenaSyncState}">${esc(arenaSyncStatus)}</div></div><h2>Seus dados</h2><div class="card"><button class="btn" onclick="expo()">Salvar cópia dos treinos</button><label class="btn alt" style="margin-top:10px">Restaurar cópia<input type="file" hidden accept=".json,application/json" onchange="impf(this)"></label><div id="bkm" role="status"></div><p class="privacy-note">A cópia pode conter seus percursos GPS. Registros de outras modalidades das versões anteriores são preservados no arquivo.</p></div><div class="card"><b>Localização e privacidade</b><p class="mu">O GPS é usado durante o treino com sua permissão. Mantenha o app aberto e a tela ligada. O navegador pode interromper a gravação em segundo plano.</p></div>`};
V.run=function(){const k=R?.sport||enduranceMode,a=enduranceRuns(k),w=a.filter(r=>inD(r.date,7));return `<button class="back" onclick="back()">‹ Voltar</button><div class="page-kicker">GRAVAR COM GPS</div><div class="ph"><span class="si">${IC[k]}</span><div><h1>${enduranceName(k)}</h1><div class="mu">${k==='bike'?'Seu pedal, quilômetro a quilômetro.':'Do primeiro passo à maratona.'}</div></div></div><div id="ctl"></div><div id="live"></div><h2>Seu desempenho · ${enduranceName(k)}</h2><div class="grid"><div class="card"><div class="mu">Distância · 7 dias</div><div class="big">${km(w).toFixed(1)}<small> km</small></div></div><div class="card"><div class="mu">Maior distância</div><div class="big">${Math.max(0,...a.map(r=>r.dist)).toFixed(1)}<small> km</small></div></div></div><h2>Histórico</h2>${enduranceRows(a)}`};
const enduranceLive=live;
live=function(){enduranceLive();if(!R)return;const cycling=R.sport==='bike';if(cycling){for(const id of ['ctl','live']){const el=document.getElementById(id);if(!el)continue;const walk=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n;while(n=walk.nextNode())n.nodeValue=n.nodeValue.replace(/Corrida/g,'Pedal').replace(/corrida/g,'pedal');}const metrics=document.querySelectorAll('#live .race-metric');if(metrics[1]){metrics[1].querySelector('.mu').textContent='Velocidade média';metrics[1].querySelector('b').textContent=(R.el?R.dist*3600/R.el:0).toFixed(1);metrics[1].querySelector('small').textContent='km/h'}const note=document.querySelector('#live .privacy-note');if(note)note.textContent='* Estimativa aproximada de calorias. Mantenha a tela ligada; o GPS pode parar com o app em segundo plano.'}};
const enduranceFinish=rf;
rf=function(){const mode=R?.sport||enduranceMode;enduranceFinish();enduranceMode=mode;if(R)R.sport=mode;render()};
arenaResultText=function(){const r=S.runs[0];return `ARENA+ · ${enduranceName(enduranceSport(r))}\nDistância: ${r.dist.toFixed(2)} km\nTempo: ${fT(r.time)}\n${enduranceSport(r)==='bike'?'Velocidade: '+enduranceSpeed(r)+' km/h':'Ritmo: '+pace(r.dist,r.time)+' min/km'}`};

chk=function(t){const out=enduranceCheck(t),d=JSON.parse(t).data,g=d.enduranceGoal;if(g&&[5,10,21.0975,42.195].includes(g.distance))out.enduranceGoal={distance:g.distance,date:typeof g.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(g.date)?g.date:''};return out};

<script>
let arenaChosenMode='run',arenaCountdownTimer=null,arenaCountdownToken=0;
function arenaMode(k){arenaChosenMode=k;render()}
function arenaModePicker(){return `<div class="mode-switch" aria-label="Modalidade">${['run','bike'].map(k=>`<button class="btn ${arenaChosenMode===k?'':'alt'}" aria-pressed="${arenaChosenMode===k}" onclick="arenaMode('${k}')">${IC[k]} ${enduranceName(k)}</button>`).join('')}</div><button class="btn quick-start" onclick="enduranceStart(arenaChosenMode)">Começar ${arenaChosenMode==='bike'?'pedal':'corrida'} ${gpsIcon('play')}</button>`}
function arenaWeeklyGoals(){return S.weeklyGoals||{run:10,bike:50}}
function arenaGoalBars(){const goals=arenaWeeklyGoals();return `<div class="week-goals">${['run','bike'].map(k=>{const value=km(enduranceRuns(k).filter(r=>inD(r.date,7))),target=goals[k];return `<div class="card"><div class="goal-head"><b>${enduranceName(k)}</b><span>${value.toFixed(1)} / ${target} km</span></div><div class="pg" role="progressbar" aria-label="Meta semanal de ${enduranceName(k)}" aria-valuemin="0" aria-valuemax="${target}" aria-valuenow="${Math.min(value,target)}"><div style="width:${Math.min(100,value/target*100)}%"></div></div></div>`}).join('')}</div>`}
function arenaDraftKey(){return arenaDataKey+'-active-workout'}
function arenaReadDraft(){try{const d=JSON.parse(localStorage.getItem(arenaDraftKey()));return d&&['run','bike'].includes(d.sport)&&Number.isFinite(d.dist)&&d.dist>=0&&Number.isFinite(d.el)&&d.el>=0&&Array.isArray(d.pts)&&d.pts.every(p=>Array.isArray(p)&&p.length>=2&&Number.isFinite(p[0])&&Number.isFinite(p[1]))?d:null}catch(_){return null}}
function arenaDraftCard(){const d=arenaReadDraft();return d?`<div class="card draft-card"><b>Há um treino interrompido</b><p class="mu">${enduranceName(d.sport)} · ${d.dist.toFixed(2)} km · ${fT(d.el)}. O tempo em que o app ficou fechado não será contado.</p><button class="btn" onclick="arenaRecoverDraft()">Recuperar treino</button><button class="btn alt" onclick="arenaDiscardDraft(this)">Descartar</button></div>`:''}
function arenaDiscardDraft(button){if(!button.dataset.confirm){button.dataset.confirm='1';button.textContent='Toque novamente para descartar';return}localStorage.removeItem(arenaDraftKey());render()}
function arenaRememberWorkout(){if(!arenaUser||!R||R.st==='idle')return;try{localStorage.setItem(arenaDraftKey(),JSON.stringify({sport:R.sport||'run',dist:R.dist,el:elapsed(R),max:R.max,pts:R.pts,savedAt:Date.now()}))}catch(_){}}
function arenaRecoverDraft(){const d=arenaReadDraft();if(!d)return;enduranceStart(d.sport);R.dist=d.dist;R.max=d.max||0;R.el=d.el;R.accumMs=d.el*1000;R.pts=d.pts;R.st='pause';R.skip=true;R.err='Treino recuperado. Autorize o GPS antes de continuar.';render()}
const arenaPauseBase=rp;
rp=function(){if(R?.st==='pause'&&R.wid==null){const draft={...R};if(gpsAccess!=='ready'||Date.now()-gpsConfirmedAt>120000){gpsAskResume();return}gpsOriginalStart();if(R?.st==='run'){R.dist=draft.dist;R.max=draft.max;R.accumMs=draft.accumMs;R.pts=draft.pts;R.skip=true;R.err='';live()}return}arenaPauseBase();arenaRememberWorkout()};
function gpsAskResume(){if(!navigator.geolocation)return toast('GPS indisponível neste navegador.');navigator.geolocation.getCurrentPosition(p=>{if(p.coords.accuracy>35)return toast('Sinal impreciso. Tente em um local aberto.');gpsAccess='ready';gpsConfirmedAt=Date.now();rp()},()=>toast('Permita a localização para continuar.'),{enableHighAccuracy:true,timeout:20000,maximumAge:0})}
const arenaStartBase=rs;
function arenaCancelCountdown(){arenaCountdownToken++;clearInterval(arenaCountdownTimer);arenaCountdownTimer=null;document.getElementById('arena-countdown')?.remove()}
rs=function(){if(!R||R.st!=='idle'||arenaCountdownTimer)return;if(gpsAccess!=='ready'||Date.now()-gpsConfirmedAt>120000){gpsAsk();return}let count=3;const token=++arenaCountdownToken,box=document.createElement('div');box.id='arena-countdown';box.className='countdown-overlay';box.setAttribute('role','dialog');box.setAttribute('aria-modal','true');box.innerHTML='<div><p>Prepare-se para '+(R.sport==='bike'?'pedalar':'correr')+'</p><strong role="status" aria-live="assertive">3</strong><button class="btn alt" onclick="arenaCancelCountdown()">Cancelar</button></div>';box.addEventListener('keydown',e=>{if(e.key==='Escape')arenaCancelCountdown();if(e.key==='Tab'){e.preventDefault();box.querySelector('button').focus()}});document.body.append(box);box.querySelector('button').focus();arenaCountdownTimer=setInterval(()=>{if(token!==arenaCountdownToken)return;count--;if(count>0)box.querySelector('strong').textContent=count;else{arenaCancelCountdown();arenaStartBase();arenaRememberWorkout()}},1000)};
setInterval(arenaRememberWorkout,5000);window.addEventListener('pagehide',arenaRememberWorkout);document.addEventListener('visibilitychange',()=>{if(document.hidden)arenaRememberWorkout()});
const arenaFinishWithDraft=rf;
rf=function(){const count=S.runs.length;arenaFinishWithDraft();if(S.runs.length>count)localStorage.removeItem(arenaDraftKey());render()};
enduranceRows=function(a){return a.map(r=>{const k=enduranceSport(r);return `<details class="card training-details"><summary class="endurance-record"><span>${IC[k]}</span><div style="flex:1"><b>${enduranceName(k)} · ${r.dist.toFixed(2)} km</b><small>${new Date(r.date).toLocaleDateString('pt-BR')} · ${fT(r.time)}</small></div><div><b>${k==='bike'?enduranceSpeed(r):pace(r.dist,r.time)}</b><small>${k==='bike'?'km/h':'min/km'} · ver mais</small></div></summary><div class="detail-stats"><div><b>${fT(r.time)}</b><small>Tempo ativo</small></div><div><b>${enduranceSpeed(r)} km/h</b><small>Velocidade média</small></div><div><b>${Number(r.max||0).toFixed(1)} km/h</b><small>Velocidade máxima registrada</small></div><div><b>${Math.round(r.cal||0)} kcal</b><small>Estimativa de calorias</small></div></div><div class="route-frame">${route(r.pts)}</div></details>`}).join('')||'<div class="empty"><b>Ainda não há treinos aqui</b><span>Seu próximo percurso aparecerá nesta lista.</span></div>'};
V.home=function(){const a=S.runs.filter(r=>inD(r.date,7));return `<div class="brandbar"><div class="brand-word">ARENA<span>+</span></div><div class="brand-chip">CORRA · PEDALE</div></div><div class="hd">${AV()}<div><div class="mu">Um quilômetro de cada vez.</div><h1>Olá, ${esc(S.name.split(' ')[0])}</h1></div></div>${arenaDraftCard()}<section class="arena-hero"><div class="overline">Sua semana · últimos 7 dias</div><div class="hero-distance">${km(a).toFixed(1)} <small>km</small></div><div class="hero-stats"><span>${a.length} treinos</span><span>${(a.reduce((t,r)=>t+r.time,0)/3600).toFixed(1)} horas em movimento</span></div>${arenaModePicker()}</section><div class="section-head"><h2>Metas da semana</h2><button class="back" onclick="go('prof')">Editar</button></div>${arenaGoalBars()}<h2>Últimos treinos</h2>${enduranceRows(S.runs.slice(0,3))}`};
V.sports=function(){return `<div class="page-kicker">SEU MOMENTO DE EVOLUIR</div><h1>Vamos treinar?</h1><p class="mu">Escolha a modalidade e autorize o GPS para começar.</p>${arenaDraftCard()}${arenaModePicker()}<div class="card" style="margin-top:20px"><b>Antes de sair</b><p class="mu">Espere o sinal GPS em um local aberto. Mantenha a tela ligada e o Arena visível durante o treino.</p></div><h2>Objetivo de prova</h2>${enduranceGoalCard()}<button class="btn alt" onclick="go('com')">Escolher distância da prova</button>`};
const arenaProfileBeforeGoals=V.prof;
function arenaSaveWeekly(form){const run=Number(form.elements.runGoal.value),bike=Number(form.elements.bikeGoal.value);if(!Number.isFinite(run)||!Number.isFinite(bike)||run<=0||bike<=0||run>2000||bike>2000)return toast('Escolha metas entre 1 e 2.000 km.');S.weeklyGoals={run,bike};save();toast('Metas atualizadas');render()}
V.prof=function(){const g=arenaWeeklyGoals();return arenaProfileBeforeGoals()+`<h2>Metas semanais</h2><form class="card" onsubmit="event.preventDefault();arenaSaveWeekly(this)"><div class="goal-fields"><div><label for="run-goal">Corrida · km</label><input id="run-goal" name="runGoal" type="number" min="1" max="2000" step="1" value="${g.run}" required></div><div><label for="bike-goal">Ciclismo · km</label><input id="bike-goal" name="bikeGoal" type="number" min="1" max="2000" step="1" value="${g.bike}" required></div></div><button class="btn" type="submit">Salvar metas</button></form><h2>Use no celular</h2><div class="card"><b>Atalho na tela inicial</b><p class="mu">No Android: menu do navegador → Adicionar à tela inicial.<br>No iPhone: Compartilhar → Adicionar à Tela de Início.</p><p class="privacy-note">O atalho abre esta versão web. Para gravar, mantenha o app aberto e a tela ligada.</p></div>`};
const arenaCheckWithGoals=chk;
chk=function(t){const out=arenaCheckWithGoals(t),g=JSON.parse(t).data.weeklyGoals;if(g&&Number.isFinite(g.run)&&Number.isFinite(g.bike)&&g.run>=1&&g.run<=2000&&g.bike>=1&&g.bike<=2000)out.weeklyGoals={run:g.run,bike:g.bike};return out};
const arenaDumpWithGoals=dump;
dump=function(){const out=JSON.parse(arenaDumpWithGoals());out.data.weeklyGoals=arenaWeeklyGoals();return JSON.stringify(out)};
const arenaRenderFour=render;
render=function(){arenaRenderFour();const nav=document.querySelector('#nav');if(nav)nav.innerHTML=[['home','Início',IC.home],['sports','Treinar',IC.run],['act','Histórico',IC.act],['prof','Perfil',IC.prof]].map(([k,n,i])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')" ${tab===k?'aria-current="page"':''}><span>${i}</span>${n}</button>`).join('')};
const arenaGateBeforeTimeout=arenaGate;let arenaGateTimer=null;
arenaGate=function(){arenaGateBeforeTimeout();clearTimeout(arenaGateTimer);if(document.querySelector('#arena-login-gate')&&(arenaAuthLoading||(arenaUser&&!arenaCloudReady)))arenaGateTimer=setTimeout(()=>{const inner=document.querySelector('#arena-login-gate .account-panel');if(!inner)return;if(inner.querySelector('[data-load-help]'))return;inner.insertAdjacentHTML('beforeend','<div data-load-help><p class="mu">A conexão está demorando. Confira sua internet e tente carregar novamente.</p><button class="btn alt" onclick="location.reload()">Recarregar Arena</button></div>')},18000)};
render();

<script>
// ARENA+ Comunidade v1: nenhuma coordenada é enviada ao endpoint social.
let AC={user:null,groups:[],groupId:null,detail:null,section:'feed',sport:'run',period:'week',metric:'distance',offset:0,loading:false,busy:false,error:'',ready:false,seq:0,comments:{}};
let ACpoll=null;
function acReset(){clearInterval(ACpoll);AC={user:arenaUser?.id||null,groups:[],groupId:null,detail:null,section:'feed',sport:'run',period:'week',metric:'distance',offset:0,loading:false,busy:false,error:'',ready:false,seq:AC.seq+1,comments:{}}}
function acEscape(x){return esc(String(x??''))}
function acNotice(text){const el=document.getElementById('ac-notice');if(el){el.textContent=text;el.focus()}else toast(text)}
function acError(e){const m=String(e?.message||e||'');if(/PGRST202|42883|schema cache|Could not find.*function|does not exist/i.test(m+' '+e?.code))return 'A comunidade ainda precisa ser ativada no Supabase. Execute o arquivo ativar_comunidade.sql no SQL Editor do projeto do Arena.';if(/JWT|session|sessão|authenticated|42501/i.test(m))return m.includes('grupo')?m:'Sua sessão ou acesso mudou. Entre novamente e atualize os grupos.';if(/Failed to fetch|network|timeout|AbortError/i.test(m))return 'Não foi possível conectar. Confira a internet e tente novamente.';return m.slice(0,400)||'Não foi possível concluir. Tente novamente.'}
async function acCall(action,payload={}){if(!arenaUser||!arenaClient)throw Error('Entre na sua conta.');const uid=arenaUser.id;const {data,error}=await arenaClient.rpc('arena_community',{p_action:action,p_payload:payload}).abortSignal(AbortSignal.timeout(20000));if(error)throw error;if(arenaUser?.id!==uid)throw Error('A sessão mudou.');return data}
function acIsOwner(){return AC.detail?.group.owner_id===arenaUser?.id}
function acPicker(){return `<label for="ac-groups">Seu grupo</label><select id="ac-groups" onchange="acChoose(this.value)"><option value="">Escolha um grupo</option>${AC.groups.map(g=>`<option value="${acEscape(g.id)}" ${AC.groupId===g.id?'selected':''}>${acEscape(g.name)} · ${g.members} pessoas</option>`).join('')}</select>`}
function acCurrent(){return AC.user===arenaUser?.id}
async function acLoad(quiet=false){if(!arenaUser)return;if(!acCurrent())acReset();if(AC.loading||AC.busy)return;const seq=++AC.seq,uid=arenaUser.id;AC.loading=true;AC.error='';if(!quiet)acPaint();try{const list=await acCall('list');if(seq!==AC.seq||uid!==arenaUser?.id)return;AC.groups=list.groups||[];if(!AC.groups.some(g=>g.id===AC.groupId)){AC.groupId=AC.groups[0]?.id||null;AC.offset=0;AC.comments={}}if(AC.groupId){const detail=await acCall('read',{group_id:AC.groupId,sport:AC.sport,period:AC.period,metric:AC.metric,offset:AC.offset});if(seq!==AC.seq||uid!==arenaUser?.id)return;AC.detail=detail}else AC.detail=null;AC.ready=true}catch(e){if(seq!==AC.seq||uid!==arenaUser?.id)return;AC.error=acError(e)}finally{if(seq===AC.seq&&uid===arenaUser?.id){AC.loading=false;acPaint();acStartPolling()}}}
function acStartPolling(){clearInterval(ACpoll);if(tab==='com'&&!sub&&AC.groupId&&AC.ready)ACpoll=setInterval(()=>{const active=document.activeElement;if(document.hidden||AC.busy||AC.loading||active?.closest('#ac-community')?.matches('input,textarea,select')||active?.matches('#ac-community input,#ac-community textarea,#ac-community select'))return;acLoad(true)},45000)}
function acChoose(id){if(AC.busy)return;AC.seq++;AC.loading=false;AC.groupId=id||null;AC.detail=null;AC.offset=0;AC.comments={};acLoad()}
function acTab(name){AC.section=name;AC.comments={};acPaint()}
function acFilter(key,value){if(AC.loading||AC.busy)return;AC[key]=value;AC.offset=0;acLoad()}
function acPaint(){if(tab==='com'&&!sub){const main=document.querySelector('#main');if(main)main.innerHTML=V.com()}}
async function acMutate(action,payload={},success='Pronto.'){if(AC.busy)return false;const uid=arenaUser?.id,gid=AC.groupId,seq=++AC.seq;AC.loading=false;clearInterval(ACpoll);AC.busy=true;acPaint();try{const out=await acCall(action,{group_id:gid,name:S.name,...payload});if(uid!==arenaUser?.id||seq!==AC.seq)return false;if(out.group_id)AC.groupId=out.group_id;AC.error='';acNotice(success);return true}catch(e){if(uid===arenaUser?.id&&seq===AC.seq){AC.error=acError(e);acNotice(AC.error)}return false}finally{if(uid===arenaUser?.id&&seq===AC.seq){const failure=AC.error;AC.busy=false;AC.comments={};await acLoad();if(failure&&uid===arenaUser?.id){AC.error=failure;acPaint()}}}}
async function acCreate(form){const title=form.elements.title.value.trim();if(title.length<3)return acNotice('Digite pelo menos 3 caracteres.');const ok=await acMutate('create',{title},'Grupo criado. O convite está na aba Pessoas.');if(ok)AC.section='people';acPaint()}
async function acJoin(form){let code=form.elements.code.value.trim();const linked=code.match(/[?&]grupo=([a-f0-9]{32})/i);if(linked)code=linked[1];try{const url=new URL(code);code=url.searchParams.get('grupo')||code}catch(_){}const ok=await acMutate('join',{code},'Você entrou no grupo.');if(ok){window.arenaPendingInvite=null;AC.section='feed';}acPaint()}
function acForms(){return `<details class="card ac-form"><summary>Criar grupo</summary><form onsubmit="event.preventDefault();acCreate(this)"><label for="ac-new-group">Nome do grupo</label><input id="ac-new-group" name="title" required minlength="3" maxlength="60" placeholder="Ex.: Corrida de Mulungu"><button class="btn" ${AC.busy?'disabled':''}>Criar grupo privado</button></form></details><details class="card ac-form"><summary>Entrar com convite</summary><form onsubmit="event.preventDefault();acJoin(this)"><label for="ac-code">Código ou link do convite</label><input id="ac-code" name="code" required maxlength="300" autocomplete="off" autocapitalize="none" placeholder="Cole o convite recebido"><button class="btn alt" ${AC.busy?'disabled':''}>Entrar no grupo</button></form></details>`}
function acWorkouts(){return S.runs.filter(r=>Number.isFinite(r.dist)&&r.dist>0&&Number.isFinite(r.time)&&r.time>0).slice(0,200)}
function acPublishForm(){const a=acWorkouts();return `<details class="card ac-form"><summary>${gpsIcon('share')} Publicar um treino</summary><p class="mu">Só o resumo será publicado. Seu percurso GPS e e-mail ficam privados. O ranking aceita treinos finalizados após a sua primeira entrada no grupo.</p>${a.length?`<form onsubmit="event.preventDefault();acPublish(this)"><label for="ac-workout">Treino finalizado</label><select id="ac-workout" name="workout">${a.map((r,i)=>`<option value="${i}">${enduranceName(enduranceSport(r))} · ${r.dist.toFixed(2)} km · ${new Date(r.date).toLocaleString('pt-BR')}</option>`).join('')}</select><label for="ac-caption">Legenda (opcional)</label><textarea id="ac-caption" name="caption" maxlength="500" rows="2" placeholder="Como foi o treino?"></textarea><button class="btn" ${AC.busy?'disabled':''}>Publicar neste grupo</button></form>`:'<p class="mu">Finalize um treino com GPS para publicar.</p>'}</details>`}
async function acPublish(form){if(AC.busy)return;const r=acWorkouts()[Number(form.elements.workout.value)];if(!r)return;const caption=form.elements.caption.value.trim(),date=r.date;try{await arenaPushAuto();if(!arenaCloudReady||localStorage.getItem(arenaDataKey+'-pending')==='1')throw Error('O treino ainda não foi salvo na conta. Confira a conexão e tente novamente.');await acMutate('publish',{workout_at:date,caption},'Treino publicado e incluído no ranking.')}catch(e){acNotice(acError(e))}}
function acPost(p){const running=p.sport==='run',distance=Number(p.distance),seconds=Number(p.seconds),name=acEscape(p.display_name),own=p.user_id===arenaUser?.id;return `<article class="card ac-post"><header><div class="ac-avatar" aria-hidden="true">${acEscape((p.display_name||'A').slice(0,1).toUpperCase())}</div><div><b>${name}</b><small>${enduranceName(p.sport)} · ${new Date(p.workout_at).toLocaleDateString('pt-BR')}</small></div></header><p class="ac-caption">${acEscape(p.caption)}</p><div class="ac-stats"><div><strong>${distance.toFixed(2)}</strong><small>km</small></div><div><strong>${fT(seconds)}</strong><small>tempo</small></div><div><strong>${running?pace(distance,seconds):(distance*3600/seconds).toFixed(1)}</strong><small>${running?'min/km':'km/h'}</small></div></div><div class="ac-actions"><button class="btn alt sm ${p.liked?'ac-liked':''}" ${AC.busy?'disabled':''} aria-pressed="${p.liked}" onclick="acMutate('like',{post_id:'${p.id}',liked:${!p.liked}},'Curtida atualizada.')">${p.liked?'♥':'♡'} ${p.likes}</button><button class="btn alt sm" onclick="acComments('${p.id}')">Comentários · ${p.comment_count}</button>${own||acIsOwner()?`<button class="ac-text-button" ${AC.busy?'disabled':''} onclick="acConfirm(this,'delete_post','${p.id}')">Remover</button>`:''}</div>${acCommentBox(p)}</article>`}
async function acComments(id){if(AC.comments[id]){delete AC.comments[id];acPaint();return}const seq=AC.seq,uid=arenaUser?.id;try{const result=await acCall('comments',{group_id:AC.groupId,post_id:id});if(seq!==AC.seq||uid!==arenaUser?.id)return;AC.comments[id]=result.comments;acPaint()}catch(e){acNotice(acError(e))}}
function acCommentBox(p){const a=AC.comments[p.id];if(!a)return '';return `<section class="ac-comments"><p class="mu">Últimos 30 comentários</p>${a.map(c=>`<div class="ac-comment"><b>${acEscape(c.display_name)}</b><p>${acEscape(c.body)}</p>${c.user_id===arenaUser?.id||acIsOwner()?`<button class="ac-text-button" onclick="acConfirm(this,'delete_comment','${c.id}')">Excluir comentário</button>`:''}</div>`).join('')||'<p class="mu">Seja o primeiro a comentar.</p>'}<form onsubmit="event.preventDefault();acAddComment(this,'${p.id}')"><label for="comment-${p.id}">Seu comentário</label><input id="comment-${p.id}" name="body" required maxlength="300" placeholder="Incentive o grupo"><button class="btn alt sm" ${AC.busy?'disabled':''}>Enviar comentário</button></form></section>`}
async function acAddComment(form,id){const body=form.elements.body.value.trim();if(!body)return;const ok=await acMutate('comment',{post_id:id,body},'Comentário publicado.');if(ok)await acComments(id)}
function acConfirm(button,action,id){if(!button.dataset.confirm){button.dataset.confirm='1';button.textContent='Confirmar '+(action==='delete_group'?'exclusão do grupo':'remoção');return}const field=action==='delete_post'?'post_id':action==='delete_comment'?'comment_id':action==='delete_challenge'?'challenge_id':'user_id';acMutate(action,id?{[field]:id}:{},action==='delete_group'?'Grupo excluído.':'Atualizado.')}
function acRank(){const d=AC.detail,rank=[...(d.rank||[])].sort((a,b)=>AC.metric==='count'?Number(b.training_count)-Number(a.training_count)||Number(b.km)-Number(a.km)||a.user_id.localeCompare(b.user_id):Number(b.km)-Number(a.km)||Number(b.training_count)-Number(a.training_count)||a.user_id.localeCompare(b.user_id));let previous=null,place=0;const rows=rank.map((r,i)=>{const key=AC.metric==='count'?`${r.training_count}/${r.km}`:`${r.km}/${r.training_count}`;if(key!==previous)place=i+1;previous=key;return `<li class="${r.user_id===arenaUser?.id?'ac-me':''}"><span class="ac-rank-place">${place}</span><div><b>${acEscape(r.display_name)}${r.user_id===arenaUser?.id?' · você':''}</b><small>${r.training_count} treinos publicados</small></div><strong>${AC.metric==='count'?r.training_count:Number(r.km).toFixed(2)}<small>${AC.metric==='count'?'treinos':'km'}</small></strong></li>`}).join('');return `<div class="card ac-filters"><div class="mode-switch">${['run','bike'].map(k=>`<button class="btn ${AC.sport===k?'':'alt'} sm" onclick="acFilter('sport','${k}')">${enduranceName(k)}</button>`).join('')}</div><div class="goal-fields"><div><label for="ac-period">Período</label><select id="ac-period" onchange="acFilter('period',this.value)"><option value="week" ${AC.period==='week'?'selected':''}>Semana atual</option><option value="month" ${AC.period==='month'?'selected':''}>Mês atual</option></select></div><div><label for="ac-metric">Classificar por</label><select id="ac-metric" onchange="acFilter('metric',this.value)"><option value="distance" ${AC.metric==='distance'?'selected':''}>Distância</option><option value="count" ${AC.metric==='count'?'selected':''}>Treinos</option></select></div></div><p class="mu">${new Date(d.period_start).toLocaleDateString('pt-BR')} até ${new Date(new Date(d.period_end)-1).toLocaleDateString('pt-BR')} · horário de Brasília</p></div><ol class="ac-ranking">${rows}</ol><p class="privacy-note">Ranking recreativo. Só conta o que foi publicado neste grupo, pela data de finalização. Remover uma publicação retira seus pontos. Distância não mede intensidade ou condicionamento. Não há garantia contra fraude.</p>`}
function acChallengeCard(c){const km=Number(c.my_km),target=Number(c.target),pct=Math.min(100,km/target*100);return `<div class="card"><span class="tag">${enduranceName(c.sport)}</span><h3>${acEscape(c.title)}</h3><p class="mu">${c.starts_on.split('-').reverse().join('/')} a ${c.ends_on.split('-').reverse().join('/')}</p><div class="goal-head"><b>Seu progresso</b><span>${km.toFixed(2)} / ${target} km</span></div><div class="pg" role="progressbar" aria-label="Seu progresso no desafio" aria-valuemin="0" aria-valuemax="${target}" aria-valuenow="${Math.min(km,target)}"><div style="width:${pct}%"></div></div><p class="mu">${pct>=100?'Meta alcançada!':'Publique seus treinos dessa modalidade dentro do período.'}</p>${acIsOwner()?`<button class="ac-text-button" onclick="acConfirm(this,'delete_challenge','${c.id}')">Excluir desafio</button>`:''}</div>`}
function acDay(){return new Intl.DateTimeFormat('sv-SE',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function acChallenges(){return `<p class="mu">Desafios de distância para cada participante. O progresso usa os treinos publicados no grupo, pela data de finalização.</p>${(AC.detail.challenges||[]).map(acChallengeCard).join('')||'<div class="empty"><b>Nenhum desafio por enquanto</b><span>O administrador pode criar o primeiro.</span></div>'}${acIsOwner()?`<details class="card ac-form"><summary>Criar desafio</summary><form onsubmit="event.preventDefault();acCreateChallenge(this)"><label for="ac-ch-title">Nome do desafio</label><input id="ac-ch-title" name="title" required minlength="3" maxlength="60" placeholder="Ex.: 20 km nesta semana"><div class="goal-fields"><div><label for="ac-ch-sport">Modalidade</label><select id="ac-ch-sport" name="sport"><option value="run">Corrida</option><option value="bike">Ciclismo</option></select></div><div><label for="ac-ch-target">Meta por pessoa · km</label><input id="ac-ch-target" name="target" type="number" min="0.1" max="5000" step="0.1" required></div></div><div class="goal-fields"><div><label for="ac-ch-start">Início</label><input id="ac-ch-start" name="starts_on" type="date" min="${acDay()}" value="${acDay()}" required></div><div><label for="ac-ch-end">Fim</label><input id="ac-ch-end" name="ends_on" type="date" min="${acDay()}" required></div></div><button class="btn" ${AC.busy?'disabled':''}>Criar desafio</button></form></details>`:''}`}
async function acCreateChallenge(form){const p=Object.fromEntries(new FormData(form));p.target=Number(p.target);await acMutate('challenge',p,'Desafio criado.')}
function acPeople(){const g=AC.detail.group;return `${acIsOwner()?`<div class="card"><b>Convite do grupo</b><p class="mu">Envie apenas para quem você quer convidar. Quem receber poderá entrar.</p><label for="ac-invite">Código privado</label><input id="ac-invite" readonly value="${acEscape(g.invite_code)}" onclick="this.select()"><button class="btn alt sm" onclick="acCopyInvite()">Copiar convite</button><button class="ac-text-button" onclick="acRotate(this)">Trocar código de convite</button></div>`:'<p class="mu">Peça ao administrador o convite para trazer novos participantes.</p>'}<h2>Participantes</h2>${AC.detail.members.map(m=>`<div class="card ac-member"><div><b>${acEscape(m.display_name)}</b><small>${m.user_id===g.owner_id?'Administrador':m.banned?'Bloqueado':m.active?'Participante':'Fora do grupo'}</small></div>${acIsOwner()&&m.user_id!==arenaUser?.id?(m.banned?`<button class="btn alt sm" onclick="acMutate('unban',{user_id:'${m.user_id}'},'Bloqueio retirado. A pessoa pode usar um novo convite.')">Desbloquear</button>`:m.active?`<button class="ac-text-button" onclick="acConfirm(this,'remove_member','${m.user_id}')">Remover e bloquear</button>`:''):''}</div>`).join('')}<details class="card ac-form"><summary>${acIsOwner()?'Administrar grupo':'Sair do grupo'}</summary>${acIsOwner()?`<form onsubmit="event.preventDefault();acMutate('rename',{title:this.elements.title.value},'Nome atualizado.')"><label for="ac-rename">Nome do grupo</label><input id="ac-rename" name="title" minlength="3" maxlength="60" required value="${acEscape(g.name)}"><button class="btn alt">Salvar nome</button></form><p class="privacy-note">Excluir o grupo remove suas publicações, comentários e desafios. Os treinos privados dos atletas permanecem nas contas.</p><button class="btn red" onclick="acConfirm(this,'delete_group')">Excluir grupo</button>`:`<p class="mu">Ao sair, suas publicações deixam de aparecer no feed e ranking. Se voltar com convite, elas reaparecem.</p><button class="btn alt" onclick="acLeave(this)">Sair deste grupo</button>`}</details>`}
async function acCopyInvite(){const code=AC.detail.group.invite_code,url=new URL(location.origin+location.pathname);url.searchParams.set('grupo',code);try{await navigator.clipboard.writeText(url.href);acNotice('Convite copiado.')}catch(_){document.getElementById('ac-invite')?.select();acNotice('Selecione e copie o código acima.')}}

function acLeave(button){if(!button.dataset.confirm){button.dataset.confirm='1';button.textContent='Confirmar saída';return}acMutate('leave',{},'Você saiu do grupo.')}
V.com=function(){if(!acCurrent())acReset();return `<section id="ac-community"><div class="page-kicker">JUNTOS A CADA QUILÔMETRO</div><h1>Comunidade</h1><p class="mu">Seu grupo. Seus treinos. Uma evolução compartilhada.</p><div id="ac-notice" role="status" aria-live="polite" tabindex="-1">${AC.busy?'Salvando…':AC.loading?'Carregando grupos…':AC.error?acEscape(AC.error):''}</div>${AC.error?`<div class="card"><b>Não foi possível atualizar</b><p class="mu">${acEscape(AC.error)}</p><button class="btn alt" onclick="acLoad()">Tentar novamente</button></div>`:''}${!AC.ready&&!AC.loading?'<button class="btn" onclick="acLoad()">Carregar meus grupos</button>':''}${AC.ready?acPicker():''}${acForms()}${AC.detail?`<div class="ac-group-heading"><div><h2>${acEscape(AC.detail.group.name)}</h2><p class="mu">Grupo privado · ${AC.detail.members.filter(m=>m.active).length} participantes</p></div><button class="ac-text-button" onclick="acLoad()">Atualizar</button></div><div class="ac-tabs" role="group" aria-label="Seções do grupo">${[['feed','Feed'],['rank','Ranking'],['challenges','Desafios'],['people','Pessoas']].map(([k,n])=>`<button class="${AC.section===k?'on':''}" aria-pressed="${AC.section===k}" onclick="acTab('${k}')">${n}</button>`).join('')}</div>${AC.section==='rank'?acRank():AC.section==='people'?acPeople():AC.section==='challenges'?acChallenges():acPublishForm()+(AC.detail.posts.map(acPost).join('')||'<div class="empty"><b>O primeiro treino pode ser o seu</b><span>Publique um treino finalizado para incentivar o grupo.</span></div>')+`<div class="ac-pages"><button class="btn alt sm" ${AC.offset===0?'disabled':''} onclick="acFilter('offset',Math.max(0,AC.offset-20))">Mais recentes</button><button class="btn alt sm" ${AC.detail.posts.length<20?'disabled':''} onclick="acFilter('offset',AC.offset+20)">Mais antigos</button></div>`}`:AC.ready?'<div class="empty"><b>Encontre sua turma</b><span>Crie um grupo ou entre com o convite de um amigo.</span></div>':''}<p class="privacy-note">Publicações são visíveis apenas aos membros do grupo. Nada é compartilhado automaticamente.</p></section>`};

// Mantém o objetivo de prova acessível após a aba Comunidade passar a ter grupos.

const acPreviousSp=V.sp;V.sp=function(k){return k==='race-goal'?acRaceGoalView():acPreviousSp(k)};

// Convite fica somente no estado da página até o usuário escolher entrar.
try{const url=new URL(location.href),code=url.searchParams.get('grupo');if(code&&/^[a-f0-9]{32}$/i.test(code)){window.arenaPendingInvite=code;url.searchParams.delete('grupo');history.replaceState(null,'',url.href)}}catch(_){}
