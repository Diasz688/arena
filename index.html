let arenaLoginDraftEmail='',arenaOtpPurpose='email';
const arenaCardBeforeOtp=arenaAuthCard;
arenaAuthCard=function(){if(arenaAuthLoading||!arenaClient||arenaUser)return arenaCardBeforeOtp();const create=arenaAuthMode==='signup';if(arenaAuthMode==='verify')return `<section class="account-panel"><h2>${arenaOtpPurpose==='signup'?'Confirme seu cadastro':'Seu código de entrada'}</h2><p class="mu">Digite o código enviado para <b>${esc(arenaPendingEmail)}</b>. Confira a caixa de entrada e o spam.</p><form onsubmit="event.preventDefault();arenaVerifyCode(this)"><label for="arena-code">Código recebido por e-mail</label><input id="arena-code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,10}" minlength="6" maxlength="10" required placeholder="Digite o código"><button class="btn" type="submit">Validar código e entrar</button></form><button class="btn alt" onclick="arenaResendCode(this)">Reenviar código</button><button class="btn alt sm" onclick="arenaAuthMode='login';arenaAuthNotice='';render()">Usar outro e-mail</button><div id="arena-auth-message" role="status">${esc(arenaAuthNotice)}</div><p class="privacy-note">O acesso fica salvo neste navegador. Um novo código é solicitado quando você precisar entrar novamente.</p></section>`;return `<section class="account-panel"><h2>${create?'Crie sua conta':'Entre no Arena'}</h2><p class="mu">${create?'Cadastre seus dados. Depois, digite o código recebido por e-mail para confirmar sua conta.':'O código de acesso chega no seu e-mail quando você toca em Enviar código.'}</p><div class="account-tabs"><button class="${!create?'on':''}" onclick="arenaAuthMode='login';arenaAuthNotice='';render()">Entrar</button><button class="${create?'on':''}" onclick="arenaAuthMode='signup';arenaAuthNotice='';render()">Criar conta</button></div><form onsubmit="event.preventDefault();arenaEmailAuth(this)">${create?'<label for="arena-name">Seu nome</label><input id="arena-name" name="displayName" autocomplete="name" maxlength="50" required>':''}<label for="arena-email">E-mail</label><input id="arena-email" name="email" type="email" autocomplete="email" required value="${esc(arenaLoginDraftEmail)}" placeholder="voce@gmail.com">${create?'<label for="arena-password">Senha do cadastro</label><input id="arena-password" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="128" required placeholder="Pelo menos 8 caracteres"><p class="privacy-note">Para entrar no Arena, você usará o código por e-mail.</p>':''}<button class="btn" type="submit">${create?'Criar minha conta':'Enviar código para entrar'}</button></form><div id="arena-auth-message" role="status">${esc(arenaAuthNotice)}</div></section>`};
async function arenaEmailAuth(form){if(arenaAuthBusy||!arenaClient)return;arenaAuthBusy=true;const button=form.querySelector('button[type=submit]'),email=form.elements.email.value.trim(),create=arenaAuthMode==='signup';button.disabled=true;arenaMessage(create?'Criando sua conta…':'Solicitando código de entrada…');try{if(create){const response=await fetch(arenaAuthUrl+'/auth/v1/settings',{headers:{apikey:arenaAuthPublicKey},signal:AbortSignal.timeout(15000)});if(!response.ok)throw Error('Não foi possível conferir a configuração do cadastro. Tente novamente.');const settings=await response.json();if(settings.mailer_autoconfirm!==false)throw Error('Falta um ajuste no Supabase: ative Confirm email em Authentication → Sign In / Providers → Email. O cadastro precisa de confirmação pelo código enviado ao e-mail.');
const signup=window.supabase.createClient(arenaAuthUrl,arenaAuthPublicKey,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:'arena-signup-'+crypto.randomUUID()}});try{const {data,error}=await signup.auth.signUp({email,password:form.elements.password.value,options:{data:{name:form.elements.displayName.value.trim()},emailRedirectTo:location.origin+location.pathname}});if(error)throw error;if(!data.user)throw Error('Não foi possível concluir o cadastro.');if(data.session){await signup.auth.signOut({scope:'local'});throw Error('Falta um ajuste no Supabase: ative Confirm email antes de cadastrar novas contas.')}form.elements.password.value='';arenaLoginDraftEmail=email;arenaPendingEmail=email;arenaCodeSentAt=Date.now();arenaOtpPurpose='signup';arenaAuthMode='verify';arenaAuthNotice='Código de cadastro solicitado. Seu acesso só será liberado depois da validação. Verifique também o spam.';render()}finally{signup.auth.stopAutoRefresh()}}
else {const {error}=await arenaClient.auth.signInWithOtp({email,options:{shouldCreateUser:false}});if(error)throw error;arenaPendingEmail=email;arenaLoginDraftEmail=email;arenaCodeSentAt=Date.now();arenaOtpPurpose='email';arenaAuthMode='verify';arenaAuthNotice='Código de entrada solicitado. Use a mensagem mais recente.';render()}}
catch(e){const known=String(e.message||'');arenaMessage(/Supabase:|configuração do cadastro|concluir o cadastro|pedindo confirmação/.test(known)?known:arenaAuthError(e))}finally{arenaAuthBusy=false;if(button.isConnected)button.disabled=false}}
async function arenaVerifyCode(form){if(arenaAuthBusy||!arenaClient)return;const token=form.elements.code.value.replace(/\s/g,'');if(!/^\d{6,10}$/.test(token)){arenaMessage('Digite o código recebido por e-mail.');return}arenaAuthBusy=true;const button=form.querySelector('button[type=submit]');button.disabled=true;arenaMessage('Conferindo o código…');try{const {data,error}=await arenaClient.auth.verifyOtp({email:arenaPendingEmail,token,type:arenaOtpPurpose});if(error)throw error;if(!data.session)throw Error('Sessão não recebida. Solicite outro código.');if(!(data.user||data.session.user)?.email_confirmed_at)throw Error('O e-mail ainda não foi confirmado pelo servidor. Solicite um novo código.');const wasSignup=arenaOtpPurpose==='signup';arenaPendingEmail='';arenaOtpPurpose='email';arenaAuthMode='login';arenaAuthNotice=wasSignup?'E-mail confirmado. Cadastro concluído!':'Você entrou.';await arenaSwitchUser(data.session.user)}catch(e){arenaMessage(/otp|expired|invalid/i.test(e.code+' '+e.message)?'Código incorreto ou expirado. Use o mais recente ou solicite outro.':arenaAuthError(e))}finally{arenaAuthBusy=false;if(button.isConnected)button.disabled=false}}
async function arenaResendCode(button){if(arenaAuthBusy||!arenaPendingEmail||!arenaClient)return;const seconds=Math.ceil((60000-(Date.now()-arenaCodeSentAt))/1000);if(seconds>0)return arenaMessage('Aguarde '+seconds+' segundos para solicitar outro código.');arenaAuthBusy=true;button.disabled=true;arenaMessage('Solicitando novo código…');try{const {error}=arenaOtpPurpose==='signup'?await arenaClient.auth.resend({type:'signup',email:arenaPendingEmail}):await arenaClient.auth.signInWithOtp({email:arenaPendingEmail,options:{shouldCreateUser:false}});if(error)throw error;arenaCodeSentAt=Date.now();arenaMessage('Novo código solicitado. Use a mensagem mais recente.')}catch(e){arenaMessage(arenaAuthError(e))}finally{arenaAuthBusy=false;if(button.isConnected)button.disabled=false}}
const arenaErrorBeforeLoginCode=arenaAuthError;
arenaAuthError=function(e){const m=String(e?.message||''),code=e?.code||'';if(/smtp|sending.*email|email.*send/i.test(m)||['unexpected_failure','email_send_failed'].includes(code))return 'Não foi possível enviar o e-mail de acesso. Confira o SMTP e a senha de app do remetente no Supabase. Referência: '+(code||'email_send_failed')+'.';if(/already|registered/i.test(m)||code==='user_already_exists')return 'Esta conta já existe. Use Enviar código para entrar.';if(/otp_disabled|Signups not allowed|User not found|signup_disabled/i.test(code+' '+m))return 'Não foi possível solicitar o acesso. Confira o e-mail e crie uma conta se ainda não tem cadastro.';return arenaErrorBeforeLoginCode(e)};

render();

</script>
<style>
.am-qr{display:block;width:220px;max-width:100%;height:auto;background:white;padding:12px;border-radius:14px;margin:14px auto}.am-qr+label{display:block;margin:12px 0 6px}#am-panel h2{margin-top:0}#am-panel [role=status]{font-size:13px;line-height:1.6;margin-top:12px;color:#ffd0d9}#am-panel input[readonly]{font:13px monospace;letter-spacing:1px;overflow-wrap:anywhere}#am-panel .ac-member{margin:12px 0}#am-panel button:disabled{opacity:.6}

</style>
<script>
// MFA TOTP. Segredo e QR ficam somente na memória durante a configuração.
let AM={uid:null,state:'checking',factors:[],all:[],pending:null,busy:false,error:'',notice:'',seq:0};
function amClear(){AM={uid:null,state:'checking',factors:[],all:[],pending:null,busy:false,error:'',notice:'',seq:AM.seq+1}}
function amError(e){const m=String(e?.message||e||'');if(/code|totp|invalid|expired|verification failed/i.test(m))return 'Código do autenticador incorreto ou expirado. Aguarde o próximo e confira o horário automático do celular.';if(/disabled|not enabled/i.test(m))return 'Ative a verificação TOTP em Authentication → Multi-Factor no Supabase.';return 'Não foi possível verificar a segurança da conta. Confira a conexão e tente novamente.'}
async function amTimed(promise){let timer;try{return await Promise.race([promise,new Promise((_,reject)=>{timer=setTimeout(()=>reject(Error('network timeout')),15000)})])}finally{clearTimeout(timer)}}
async function amInspect(user){const [levels,factors]=await amTimed(Promise.all([arenaClient.auth.mfa.getAuthenticatorAssuranceLevel(),arenaClient.auth.mfa.listFactors()]));if(levels.error)throw levels.error;if(factors.error)throw factors.error;const all=factors.data.all||factors.data.totp||[],totp=all.filter(f=>f.factor_type==='totp'&&f.status==='verified');return {all,factors:totp,required:(levels.data.nextLevel==='aal2'||all.some(f=>f.status==='verified'))&&levels.data.currentLevel!=='aal2',level:levels.data.currentLevel}}
const amPreviousSwitch=arenaSwitchUser;
arenaSwitchUser=async function(user){if(!user){amClear();return amPreviousSwitch(null)}const seq=++AM.seq;if(AM.uid!==user.id){AM.pending=null;AM.notice='';AM.error=''}AM.uid=user.id;AM.state='checking';arenaUser=user;arenaAuthLoading=false;arenaCloudReady=false;arenaGate();try{const status=await amInspect(user);if(seq!==AM.seq||arenaUser?.id!==user.id)return;AM.all=status.all;AM.factors=status.factors;AM.state=status.required?'required':'ready';AM.error='';if(status.required){arenaGate();return}return await amPreviousSwitch(user)}catch(e){if(seq!==AM.seq||arenaUser?.id!==user.id)return;AM.state='error';AM.error=amError(e);arenaGate()}};
function amForm(kind){return `<form onsubmit="event.preventDefault();amVerify(this,'${kind}')"><label for="am-code-${kind}">Código de 6 dígitos do autenticador</label><input id="am-code-${kind}" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" minlength="6" maxlength="6" required placeholder="000000" style="font-size:26px;letter-spacing:5px;text-align:center">${kind==='login'&&AM.factors.length>1?`<label for="am-factor">Autenticador</label><select id="am-factor" name="factor">${AM.factors.map(f=>`<option value="${esc(f.id)}">${esc(f.friendly_name||'Autenticador')}</option>`).join('')}</select>`:''}<button class="btn" ${AM.busy?'disabled':''}>${AM.busy?'Verificando…':kind==='enroll'?'Confirmar e ativar MFA':kind==='remove'?'Validar e desativar':'Validar e entrar'}</button></form>`}
const amPreviousGate=arenaGate;
arenaGate=function(){if(!arenaUser||AM.state==='ready'){amPreviousGate();return}let gate=document.getElementById('arena-login-gate');if(!gate){gate=document.createElement('div');gate.id='arena-login-gate';document.body.append(gate)}gate.setAttribute('role','dialog');gate.setAttribute('aria-modal','true');gate.setAttribute('aria-label','Verificação em duas etapas');document.body.classList.add('arena-gated');document.getElementById('app')?.setAttribute('inert','');document.getElementById('nav')?.setAttribute('inert','');gate.innerHTML=`<div class="gate-inner"><div class="brand-word">ARENA<span>+</span></div><section class="account-panel"><h2>${AM.state==='checking'?'Verificando a segurança':AM.state==='error'?'Não foi possível verificar':'Verificação em duas etapas'}</h2><p class="mu">${AM.state==='checking'?'Conferindo se sua conta usa autenticador…':AM.state==='required'?'Abra o Google Authenticator, Microsoft Authenticator ou outro aplicativo configurado e digite o código do Arena. Este código não chega por e-mail.':'Não liberamos seus treinos sem conferir a segurança da conta.'}</p>${AM.state==='required'?(AM.factors.length?amForm('login'):'<p class="mu">Sua conta exige um segundo fator que esta versão não oferece. Use o autenticador TOTP configurado ou procure o administrador do projeto.</p>'):''}<div role="status" aria-live="polite">${esc(AM.error)}</div>${AM.state==='error'?'<button class="btn alt" onclick="arenaSwitchUser(arenaUser)">Tentar novamente</button>':''}<button class="btn alt sm" ${AM.busy?'disabled':''} onclick="amSignOut()">Sair da conta</button><p class="privacy-note">Se perdeu o autenticador, solicite recuperação ao responsável pelo Arena. Não é possível pular esta etapa.</p></section></div>`};
async function amSignOut(){if(AM.busy)return;const {error}=await arenaClient.auth.signOut({scope:'local'});if(error){AM.error=amError(error);arenaGate();return}await arenaSwitchUser(null)}
function amQrSource(qr){if(typeof qr!=='string')return '';if(qr.startsWith('data:image/svg+xml'))return qr;if(qr.trim().startsWith('<svg'))return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(qr);return ''}
function amPanel(){if(!arenaUser)return '';const pending=AM.pending;return `<section class="card" id="am-panel"><h2>Segurança da conta</h2><span class="account-state">${AM.factors.length?'MFA ATIVADO':'MFA NÃO ATIVADO'}</span><p class="mu">Adicione uma etapa com um aplicativo autenticador. O código do autenticador é diferente do código recebido por e-mail.</p>${pending?.kind==='enroll'?`<h3>Configure seu autenticador</h3><p class="mu">Escaneie o QR Code no seu aplicativo. Se estiver no mesmo celular, copie a chave abaixo e escolha adicionar conta por chave.</p>${amQrSource(pending.qr)?`<img class="am-qr" src="${esc(amQrSource(pending.qr))}" alt="QR Code de configuração do autenticador">`:''}<label for="am-secret">Chave de configuração</label><input id="am-secret" readonly autocomplete="off" value="${esc(pending.secret)}" onclick="this.select()"><p class="privacy-note">Esta chave dá acesso aos códigos da sua conta. Guarde somente em local seguro e não envie a outras pessoas. A ativação pode encerrar outras sessões.</p>${amForm('enroll')}<button class="btn alt" ${AM.busy?'disabled':''} onclick="amCancelEnrollment()">Cancelar configuração</button>`:pending?.kind==='remove'?`<p class="mu">Confirme com um código do autenticador antes de desativá-lo.</p>${amForm('remove')}<button class="btn alt" onclick="AM.pending=null;render()">Cancelar</button>`:AM.factors.length?AM.factors.map(f=>`<div class="ac-member"><div><b>${esc(f.friendly_name||'Autenticador')}</b><small>Verificado</small></div><button class="ac-text-button" ${AM.busy?'disabled':''} onclick="amPrepareRemove('${f.id}')">Desativar</button></div>`).join(''):`<button class="btn" ${AM.busy?'disabled':''} onclick="amEnroll()">${AM.busy?'Preparando…':'Ativar autenticador'}</button><p class="privacy-note">Antes de ativar, confira se você conseguirá guardar ou recuperar a conta do aplicativo autenticador.</p>`}${!pending?AM.all.filter(f=>f.factor_type==='totp'&&f.status!=='verified').map(f=>`<button class="ac-text-button" ${AM.busy?'disabled':''} onclick="amRemovePending('${f.id}')">Cancelar configuração pendente</button>`).join(''):''}<div role="status" aria-live="polite">${esc(AM.error||AM.notice)}</div></section>`}
const amPreviousProfile=V.prof;V.prof=function(){return amPanel()+amPreviousProfile()};
async function amEnroll(){if(AM.busy||!arenaUser||arenaBusyActivity())return;const uid=arenaUser.id;AM.busy=true;AM.error='';AM.notice='';render();try{const {data,error}=await amTimed(arenaClient.auth.mfa.enroll({factorType:'totp',friendlyName:'Arena Autenticador',issuer:'Arena+'}));if(error)throw error;if(uid!==arenaUser?.id)return;AM.pending={kind:'enroll',id:data.id,qr:data.totp.qr_code,secret:data.totp.secret};}catch(e){if(uid===arenaUser?.id)AM.error=amError(e)}finally{if(uid===arenaUser?.id){AM.busy=false;render()}}}
async function amVerify(form,kind){if(AM.busy||!arenaUser)return;const code=form.elements.code.value.replace(/\s/g,'');if(!/^\d{6}$/.test(code)){AM.error='Digite os 6 dígitos do autenticador.';if(kind==='login')arenaGate();else render();return}const uid=arenaUser.id,id=kind==='login'?(form.elements.factor?.value||AM.factors[0]?.id):AM.pending?.id;if(!id)return;AM.busy=true;AM.error='';const button=form.querySelector('button');button.disabled=true;try{const {error}=await amTimed(arenaClient.auth.mfa.challengeAndVerify({factorId:id,code}));if(error)throw error;if(uid!==arenaUser?.id)return;if(kind==='remove'){const removed=await amTimed(arenaClient.auth.mfa.unenroll({factorId:id}));if(removed.error)throw removed.error;const refreshed=await arenaClient.auth.refreshSession();if(refreshed.error)throw refreshed.error;}form.elements.code.value='';AM.pending=null;AM.notice=kind==='enroll'?'Autenticador ativado. Sua conta está protegida.':kind==='remove'?'Autenticador desativado.':'Verificação concluída.';await arenaSwitchUser(arenaUser)}catch(e){if(uid===arenaUser?.id)AM.error=amError(e)}finally{if(uid===arenaUser?.id){AM.busy=false;if(AM.state==='ready')render();else arenaGate()}}}
function amPrepareRemove(id){if(AM.busy||arenaBusyActivity())return;AM.pending={kind:'remove',id};AM.error='';AM.notice='';render()}
async function amCancelEnrollment(){if(AM.busy||AM.pending?.kind!=='enroll')return;await amRemovePending(AM.pending.id)}
async function amRemovePending(id){if(AM.busy||!arenaUser)return;const uid=arenaUser.id;AM.busy=true;AM.error='';try{const {error}=await amTimed(arenaClient.auth.mfa.unenroll({factorId:id}));if(error)throw error;if(uid!==arenaUser?.id)return;AM.pending=null;const status=await amInspect(arenaUser);AM.all=status.all;AM.factors=status.factors;AM.notice='Configuração cancelada.'}catch(e){if(uid===arenaUser?.id)AM.error=amError(e)}finally{if(uid===arenaUser?.id){AM.busy=false;render()}}}
// Evita enviar dados privados ou ações sociais enquanto a segunda etapa estiver pendente.
const amVerifiedUser=arenaVerifiedUser;arenaVerifiedUser=async function(){if(AM.state!=='ready')throw Error('Conclua a verificação em duas etapas.');return amVerifiedUser()};
const amCommunityCall=acCall;acCall=async function(action,payload){if(AM.state!=='ready')throw Error('Conclua a verificação em duas etapas.');return amCommunityCall(action,payload)};
if(arenaUser)arenaSwitchUser(arenaUser);else render();

</script>
