sports(){return`<div class="page-kicker">MODALIDADES</div><h1>Seu esporte.<br>Seu ritmo.</h1><p class="page-lead">Painéis independentes para acompanhar treinos, evolução e metas de cada modalidade.</p>`+Object.entries(SP).map(([k,v])=>`<div class="card sp big s-${k}" role="button" tabindex="0" onclick="open_('${k}')" onkeydown="if(event.key==='Enter')open_('${k}')"><div class="ico">${IC[k]}</div><div><b>${v.n}</b><div class="mu">${DESC[k]}</div></div><span style="font-size:23px;color:#ff6178">↗</span></div>`).join("")},
act(){const A=[...S.runs.map(r=>({...r,sp:"run",gps:1})),...S.sess].filter(x=>!DF||x.sp===DF).sort((a,b)=>b.date.localeCompare(a.date));
return`<h1>Atividade</h1><p class="mu">Registre treinos e consulte seu diário.</p><button class="btn" style="margin-bottom:10px" onclick="open_('run')"><span class="bi">${IC.run}</span>Iniciar corrida com GPS</button>${["fut","fsl","vol"].map(k=>`<button class="btn alt" style="margin-bottom:10px" onclick="snew('${k}')"><span class="bi">${IC[k]}</span>Registrar treino de ${SP[k].n.toLowerCase()}</button>`).join("")}
<h2>Diário de treinamento</h2><div class="chips">${[["","Tudo"],...Object.entries(SP).map(([k,v])=>[k,v.n])].map(([k,n])=>`<button class="${DF===k?"on":""}" onclick="DF='${k}';rr()">${n}</button>`).join("")}</div>${A.map(x=>x.gps?`<div class="card"><span class="tag">Medido · GPS</span><div style="margin-top:6px"><b>Corrida · ${x.dist.toFixed(2)} km</b></div><div class="mu">${new Date(x.date).toLocaleDateString("pt-BR")} · ${fT(x.time)} · ${pace(x.dist,x.time)}/km</div></div>`:srow(x)).join("")||'<div class="empty"><b>Diário vazio</b><span>Seus treinos aparecem aqui.</span></div>'}`},
com(){return`<h1>Comunidade</h1><div class="card"><b>Em breve</b><p class="mu">Seguir atletas, compartilhar treinos, curtir, comentar, desafios e rankings de frequência e volume exigem contas e banco de dados online. Ainda não estão implementados.</p></div><h2>Suas atividades</h2>${feed().map(x=>`<div class="card">${x.h}</div>`).join("")||'<div class="empty"><b>Sem atividades</b></div>'}`},
prof(){const A=ALL(),tot=sumS(A,x=>x.min)/60,fav=Object.keys(SP).filter(k=>A.some(x=>x.sp===k)),gd=S.goals.filter(g=>gprog(g).p>=1).length,dias=new Set(A.filter(x=>inD(x.date,7)).map(x=>dk(x.date))).size,med=[["Primeira atividade",A.length>0],["10 atividades",A.length>=10],["10 horas de treino",tot>=10],["50 km corridos",km(S.runs)>=50],["Meta alcançada",gd>0],["Semana ativa (3 dias)",dias>=3]];
return`<div class="pcard"><label class="avu">${AV()}<input type="file" accept="image/*" hidden onchange="photo(this)"><i>✎</i></label><h1>${esc(S.name)}</h1><div class="mu">${fav.length?fav.map(k=>SP[k].n+(S.pos[k]?" · "+esc(S.pos[k]):"")).join(" | "):"Suas modalidades aparecem conforme você treina"}</div><div class="grid3"><div><b>${A.length}</b><span>atividades</span></div><div><b>${tot.toFixed(1)}</b><span>horas</span></div><div><b>${dias}</b><span>dias ativos (7d)</span></div></div></div>
<h2>Medalhas</h2><div class="medals">${med.map(([n,o])=>`<div class="${o?"on":""}"><span>${o?"★":"☆"}</span>${n}</div>`).join("")}</div>
${fav.map(k=>`<h2>Recordes · ${SP[k].n}</h2>${k==="run"?rrec():recs(k)}`).join("")}
<h2>Histórico</h2>${feed().slice(0,5).map(x=>`<div class="card">${x.h}</div>`).join("")||'<div class="empty"><b>Sem histórico ainda</b></div>'}
${S.matches.length?`<h2>Arquivo histórico</h2><details class="card"><summary>${S.matches.length} partida(s) de versões anteriores</summary><p class="mu">Seus registros antigos foram preservados apenas para consulta e backup. O Arena+ agora é voltado ao acompanhamento do atleta.</p>${S.matches.slice(0,15).map(m=>`<div class="mu" style="padding:5px 0">${esc(SP[m.sp]?.n||"Esporte")} · ${new Date(m.date).toLocaleDateString("pt-BR")}</div>`).join("")}</details>`:""}<h2>Backup e dados</h2><div class="card"><p class="mu" style="margin-top:0">Seus dados são salvos neste navegador. Exporte regularmente um backup para evitar perdas e transferir seus treinos para outro aparelho. O arquivo inclui seu histórico de localização GPS.</p><button class="btn" onclick="expo()">Exportar backup (.json)</button><label class="btn alt" style="margin-top:8px;cursor:pointer">Importar de arquivo<input type="file" accept=".json,application/json" hidden onchange="impf(this)"></label><textarea id="bk" rows="3" placeholder="Ou cole aqui o conteúdo de um backup"></textarea><button class="btn alt sm" onclick="impo($('#bk').value)">Validar texto colado</button><div id="bkm"></div></div>
<h2>Configurações</h2><div class="card"><label class="mu">Nome</label><input value="${esc(S.name)}" oninput="S.name=this.value||'Atleta';save()"><label class="mu">Meta semanal de corrida (km)</label><input type="number" value="${S.goal}" oninput="S.goal=+this.value||0;save()">${["fut","fsl","vol"].map(k=>`<label class="mu">Posição · ${SP[k].n} (opcional)</label><select onchange="S.pos['${k}']=this.value;save()"><option value="">—</option>${POS[k].map(x=>`<option${S.pos[k]===x?" selected":""}>${x}</option>`).join("")}</select>`).join("")}</div>
<div class="card"><b>Medido × informado</b><p class="mu">Medido: somente o percurso, a distância e a velocidade das corridas, captados pelo GPS. Informado: todo o resto (treinos, gols, ataques, bloqueios, impulsão), digitado por você. Nada é simulado.</p></div>
<div class="card"><b>Privacidade</b><p class="mu">Os dados ficam armazenados apenas neste navegador, sem servidor. A localização só é acessada durante uma corrida, com sua permissão. Evite compartilhar arquivos de backup: eles podem conter seus percursos GPS.</p></div>
<div class="card"><b>Status do projeto</b><p class="mu">✅ Treinos, diário, metas e recordes por modalidade<br>✅ Corrida com GPS (quando o navegador permite)<br>✅ Backup exportável e importável<br>⏳ Login e banco online<br>⏳ Comunidade, desafios e rankings<br>⏳ GPS em segundo plano (exige app nativo)</p></div>
<button class="btn red" onclick="if(this.dataset.c){S.runs=[];S.matches=[];S.teams=[];S.players=[];S.sess=[];S.goals=[];save();go('home')}else{this.dataset.c=1;this.textContent='Toque de novo para apagar tudo'}">Apagar meus dados</button>`},
sp(sp){const a=SS(sp),w=a.filter(x=>inD(x.date,7));
return`<button class="back" onclick="back()">‹ Voltar</button><div class="ph s-${sp}"><span class="si">${IC[sp]}</span><div><h1>${SP[sp].n}</h1><div class="mu">${DESC[sp]}</div></div></div><button class="btn" onclick="snew('${sp}')">+ Registrar treino</button>
<div class="grid" style="margin-top:12px"><div class="card"><div class="mu">Treinos (7 dias)</div><div class="big">${w.length}</div></div><div class="card"><div class="mu">Minutos (7 dias)</div><div class="big g">${sumS(w,x=>x.min)}</div></div><div class="card"><div class="mu">Tempo total</div><div class="big">${(sumS(a,x=>x.min)/60).toFixed(1)}<small> h</small></div></div><div class="card"><div class="mu">Intensidade média</div><div class="big">${a.length?(sumS(a,x=>x.rpe)/a.length).toFixed(1):"–"}</div></div></div>
<h2>Minutos por semana</h2><div class="card">${wbars(wk(a,x=>x.min))}</div><h2>Recordes pessoais</h2>${recs(sp)}<h2>Metas</h2>${goals(sp)}<h2>Histórico</h2>${a.map(srow).join("")||'<div class="empty"><b>Nenhum treino</b><span>Registre seu primeiro treino de '+SP[sp].n.toLowerCase()+'.</span></div>'}`},
form(){const c=SPT[F.sp];return`<button class="back" onclick="fback()">‹ Voltar</button><div class="ph s-${F.sp}"><span class="si">${IC[F.sp]}</span><div><h1>${F.id?"Editar treino":"Registrar treino"}</h1><div class="mu">${SP[F.sp].n} · dados informados por você</div></div></div>
<div class="card"><label class="mu">Tipo de treino</label><select onchange="F.type=this.value">${c.t.map(x=>`<option${F.type===x?" selected":""}>${x}</option>`).join("")}</select><div class="row"><div><label class="mu">Data</label><input type="date" value="${F.date}" max="${dk(Date.now())}" onchange="F.date=this.value"></div><div><label class="mu">Duração (min)</label><input type="number" min="1" inputmode="numeric" value="${F.min}" oninput="F.min=this.value"></div></div>
<label class="mu">Intensidade percebida: <b id="rv">${F.rpe}</b>/10</label><input type="range" min="1" max="10" value="${F.rpe}" oninput="F.rpe=+this.value;$('#rv').textContent=this.value" style="padding:0">
<h2 style="margin-top:8px">Desempenho (opcional)</h2><div class="grid">${c.m.map(([k,l])=>`<div><label class="mu">${l}</label><input type="number" step="any" min="0" inputmode="decimal" value="${F.m[k]??""}" oninput="F.m['${k}']=this.value"></div>`).join("")}</div>
<label class="form-group-label" for="training-notes">Observações</label><textarea id="training-notes" rows="3" maxlength="300" placeholder="Como foi o treino? Registre sensações e aprendizados..." oninput="F.note=this.value">${esc(F.note)}</textarea><button class="btn" onclick="fsave()">${F.id?"Salvar alterações":"Salvar treino"}</button></div>`},
run(){return`<button class="back" onclick="back()">‹ Voltar</button><div class="page-kicker">MODO PERFORMANCE</div><div class="ph s-run"><span class="si">${IC.run}</span><div><h1>Corrida</h1><div class="mu">Medido por GPS · ritmo · recordes</div></div></div>
<div class="card"><div class="mu">Meta semanal: ${km(since(7)).toFixed(1)} / ${S.goal} km</div><div class="pg" style="margin-top:8px"><div style="width:${Math.min(100,S.goal?km(since(7))/S.goal*100:0)}%"></div></div></div>
<div id="ctl"></div><div id="live"></div>
<h2>Recordes</h2>${rrec()}<h2>Evolução</h2><div class="card"><div class="mu" style="margin-bottom:8px">Km por semana</div>${wbars(wk(S.runs,x=>x.dist))}</div><div class="grid"><div class="card"><div class="mu">7 dias</div><div class="big">${km(since(7)).toFixed(1)} km</div></div><div class="card"><div class="mu">30 dias</div><div class="big">${km(since(30)).toFixed(1)} km</div></div></div>
<h2>Evolução do ritmo</h2><div class="card">${paceTrend()}</div><h2>Metas</h2>${goals("run")}<h2>Histórico</h2>${S.runs.map((r,i)=>{const p=S.runs[i+1],dl=p&&p.dist>0.05?(r.time/r.dist-p.time/p.dist):null;return`<div class="card">${route(r.pts)}<div class="row" style="margin-top:8px"><div><b>${r.dist.toFixed(2)} km</b><div class="mu">${new Date(r.date).toLocaleDateString("pt-BR")}</div></div><div><b>${fT(r.time)}</b><div class="mu">${pace(r.dist,r.time)}/km</div></div><div><b>${r.cal} kcal</b><div class="mu">máx ${r.max.toFixed(1)} km/h</div></div></div>${dl!==null?`<div class="mu" style="margin-top:6px">vs. anterior: <span class="${dl<0?"g":""}">${dl<0?"▲ ":"▼ "}${Math.abs(Math.round(dl))} s/km ${dl<0?"mais rápido":"mais lento"}</span></div>`:""}</div>`}).join("")||'<div class="empty"><b>Nenhuma corrida</b><span>Sua primeira corrida aparece aqui.</span></div>'}
<div class="card mu">Desafios de corrida: ainda não implementado.</div>`},
};
function elapsed(r){return Math.floor(((r.accumMs||0)+(r.st==="run"?Math.max(0,Date.now()-r.startedAt):0))/1000)}
function live(){
 const r=R;if(!r||!$("#live"))return;
 if(r.st!=="idle")r.el=elapsed(r);
 const el=r.el,v=el>0?r.dist/(el/3600):0,cal=Math.round(r.dist*70);
 const state=r.st==="idle"?"Pronto para iniciar":r.st==="pause"?"Atividade pausada":r.pts.length?"GPS ativo · precisão aprox. "+(r.accuracy||"?")+" m":"Procurando sinal GPS";
 $("#live").innerHTML=`<div class="card"><div class="gps-state ${r.pts.length?"good":""}"><span class="gps-dot"></span>${state}</div><div class="race-head">Tempo de corrida</div><div class="race-time">${fT(el)}</div><div class="race-metrics"><div class="race-metric"><div class="mu">Distância</div><b>${r.dist.toFixed(2)}</b><small>km</small></div><div class="race-metric"><div class="mu">Ritmo médio</div><b>${pace(r.dist,el)}</b><small>min/km</small></div><div class="race-metric"><div class="mu">Calorias</div><b>${cal}</b><small>kcal*</small></div></div><div class="route-frame">${route(r.pts)}</div><div class="race-footer"><div><div class="mu">Velocidade média</div><b>${v.toFixed(1)} km/h</b></div><div><div class="mu">Velocidade máxima</div><b>${r.max.toFixed(1)} km/h</b></div></div>${r.err?`<div class="err">${esc(r.err)}</div>`:""}${r.wn?`<div class="warn">${esc(r.wn)}</div>`:""}${r.wk?'<div class="mu" style="margin-top:8px;font-size:11px">✓ Tela mantida acesa com o app visível.</div>':""}<div class="privacy-note" style="margin-top:10px">* Calorias estimadas para 70 kg. O GPS na versão web pode parar se a tela for bloqueada.</div></div>`;
 $("#ctl").innerHTML=r.st==="idle"?`<button class="btn" onclick="rs()">▶ Iniciar corrida</button>`:`<div class="row"><button class="btn alt" onclick="rp()">${r.st==="run"?"⏸ Pausar":"▶ Continuar"}</button><button class="btn red" onclick="rf()">⏹ Finalizar</button></div>`;
}
function rs(){
 if(!R||R.st!=="idle")return;
 if(!navigator.geolocation){R.err="Este aparelho não oferece geolocalização.";return live()}
 if(!window.isSecureContext){R.err="GPS requer HTTPS ou localhost. Publique o aplicativo em um endereço seguro.";return live()}
 R.st="run";R.err="";R.pts=[];R.dist=0;R.max=0;R.el=0;R.skip=false;R.startedAt=Date.now();R.accumMs=0;
 wl();
 try{
 R.wid=navigator.geolocation.watchPosition(p=>{
  if(!R||R.st!=="run")return;
  const c=p.coords;
  if(!Number.isFinite(c.accuracy)||c.accuracy>35){R.err="Sinal GPS impreciso; procure céu aberto para registrar o percurso.";live();return}
  R.err="";R.accuracy=Math.round(c.accuracy);
  const q=[c.latitude,c.longitude,p.timestamp],l=R.pts[R.pts.length-1];
  if(l&&!R.skip){
   const d=hav(l,q),dt=(q[2]-l[2])/1000;
   if(dt<=0)return;
   if(d<0.006)return; // menos de 6 m pode ser apenas oscilação de GPS
   if(dt>120){R.skip=true;} // novo trecho depois de longo intervalo
   else{
    const speed=d/dt*3600;
    if(speed>34)return; // elimina saltos impossíveis de GPS
    R.dist+=d;R.max=Math.max(R.max,speed);
   }
  }
  R.skip=false;R.pts.push(q);live();
 },e=>{
  if(!R)return;
  R.err=e.code===1?"Permissão de localização negada. Libere o acesso nas configurações do navegador.":"Aguardando GPS. Vá para um local aberto e confirme a localização do aparelho.";
  live();
 },{enableHighAccuracy:true,maximumAge:0,timeout:20000});
 }catch(e){R.err="Não foi possível iniciar o GPS neste navegador.";R.st="idle";try{R.wk&&R.wk.release()}catch(_){};live();return}
 if(tm)clearInterval(tm);
 tm=setInterval(()=>{if(R&&R.st==="run")live()},1000);live();
}
function rp(){
 if(!R||R.st==="idle")return;
 if(R.st==="run"){R.accumMs+=Math.max(0,Date.now()-R.startedAt);R.st="pause"}
 else{R.startedAt=Date.now();R.st="run";R.skip=true}
 R.el=elapsed(R);live();
}
function rf(){
 if(!R||R.st==="idle")return;
 if(R.st==="run")R.accumMs+=Math.max(0,Date.now()-R.startedAt);
 R.st="pause";R.el=elapsed(R);
 if(R.wid!=null)navigator.geolocation.clearWatch(R.wid);
 clearInterval(tm);tm=null;
 try{R.wk&&R.wk.release()}catch(e){}
 if(R.dist>=.01){
  const k=Math.max(1,Math.ceil(R.pts.length/200));
  const pts=R.pts.filter((_,i)=>i%k===0).map(p=>[+p[0].toFixed(5),+p[1].toFixed(5)]);
  if(R.pts.length>1){const p=R.pts[R.pts.length-1];if(pts.length&&pts[pts.length-1][0]!==+p[0].toFixed(5))pts.push([+p[0].toFixed(5),+p[1].toFixed(5)])}
  S.runs.unshift({date:new Date().toISOString(),dist:R.dist,time:R.el,max:R.max,cal:Math.round(R.dist*70),pts});
  const ok=save();toast(ok?"Corrida salva ✓":"Corrida em memória. Exporte backup antes de sair.");
 } else toast("Corrida encerrada: distância insuficiente para salvar.");
 R=null;open_("run");
}

function open_(k){if(R&&R.st!=="idle"&&k!=="run"){toast("Finalize a corrida para sair.");return}sub=k;if(k==="run"&&!R)R={st:"idle",pts:[],dist:0,el:0,max:0,err:""};render()}
function back(){if(R&&R.st!=="idle"){toast("Finalize a corrida para sair.");return}sub=null;render()}
function go(t){if(R&&R.st!=="idle"){toast("Finalize a corrida antes de mudar de aba.");return}tab=t;sub=null;render()}
function render(){const mn=$("#main");mn.style.animation="none";void mn.offsetWidth;mn.style.animation="";mn.innerHTML=sub?(sub==="run"?V.run():sub==="form"?V.form():V.sp(sub)):V[tab]();if(sub==="run")live();
$("#nav").innerHTML=[["home","Início"],["sports","Esportes"],["act","Atividade"],["com","Comunidade"],["prof","Perfil"]].map(([k,n])=>`<button class="${tab===k?"on":""}" onclick="go('${k}')"><span>${IC[k]}</span>${n}</button>`).join("");window.scrollTo(0,0)}
window.addEventListener("beforeunload",e=>{if(R&&R.st!=="idle"){e.preventDefault();e.returnValue=""}});
render();
</script></body></html>
